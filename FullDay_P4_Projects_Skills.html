<!doctype html>
<html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>FullDay P4 — Projects, Skills y memoria · MyWorkIn × Grupo Vivargo</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--navy:#003C78;--blue:#0090C0;--blue-l:#57B6DD;--tint:#EAF3FA;--ink:#132a47;--gray:#5B6B7B;--line:#dbe6ef;--amber:#F2A23C;--shadow:0 18px 40px -18px rgba(2,30,60,.45);--shadow-sm:0 8px 22px -12px rgba(2,30,60,.35);--fd:'Sora',sans-serif;--fb:'Inter',sans-serif;--fc:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05101f;font-family:var(--fb);-webkit-font-smoothing:antialiased;overflow:hidden}
.viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#0a1f3a,#05101f 75%)}
.deck{position:relative;transform-origin:center center}
.stage{position:relative;width:1280px;height:720px;border-radius:18px;overflow:hidden;box-shadow:0 40px 120px -30px rgba(0,0,0,.8)}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .55s ease,transform .55s ease;transform:scale(1.02);overflow:hidden}
.slide.active{opacity:1;visibility:visible;transform:scale(1)}
.pad{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column}
.bg-light{background:radial-gradient(1200px 500px at 88% -10%,rgba(0,144,192,.10),transparent 60%),linear-gradient(180deg,#fff,#f3f8fc)}
.bg-tint{background:radial-gradient(900px 500px at 90% 110%,rgba(0,144,192,.10),transparent 60%),linear-gradient(180deg,#f6fafd,#eef5fb)}
.bg-dark{background:radial-gradient(900px 600px at 82% 8%,rgba(87,182,221,.30),transparent 55%),radial-gradient(700px 500px at 10% 100%,rgba(0,144,192,.22),transparent 60%),linear-gradient(135deg,#01244a,#003C78 58%,#0a5390)}
.bg-dark2{background:radial-gradient(800px 600px at 85% 12%,rgba(87,182,221,.22),transparent 55%),linear-gradient(150deg,#01182f,#012a52 70%)}
.kicker{font-family:var(--fb);font-weight:700;font-size:14px;letter-spacing:3px;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:10px}
.bg-dark .kicker,.bg-dark2 .kicker{color:var(--blue-l)}
.kicker .bar{width:34px;height:3px;border-radius:3px;background:currentColor}
h1.title{font-family:var(--fd);font-weight:800;color:var(--navy);font-size:42px;line-height:1.08;letter-spacing:-.5px;margin-top:14px}
.bg-dark h1.title,.bg-dark2 h1.title{color:#fff}
.lead{font-size:18px;color:var(--gray);margin-top:12px;max-width:62ch;line-height:1.5}
.bg-dark .lead,.bg-dark2 .lead{color:#bcd6ec}
.logo{height:40px}.logo.white{filter:brightness(0) invert(1)}
.brandmark{position:absolute;right:60px;bottom:34px;height:30px;opacity:.95}.brandmark.cobrand{display:flex;align-items:center;gap:14px}.brandmark.cobrand img{height:26px;width:auto}.cb-sep{width:1px;height:22px;background:rgba(255,255,255,.35)}.logo-plate{align-items:center;gap:18px;align-self:flex-start}.logo-plate .vv{filter:brightness(0)}.logo-plate .cb-sep{background:#d5dbe2;height:34px}
.footer{position:absolute;left:72px;right:72px;bottom:26px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--gray);border-top:1px solid var(--line);padding-top:10px}
.footer .sec{color:var(--blue);font-weight:700}
.bg-dark .footer,.bg-dark2 .footer{border-color:rgba(255,255,255,.14);color:#9fc0dc}.bg-dark .footer .sec,.bg-dark2 .footer .sec{color:var(--blue-l)}
.grid{display:grid;gap:18px}
.ic{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none}.ic svg{stroke-width:2.1}
.ic.navy{background:var(--navy);color:#fff}.ic.blue{background:linear-gradient(135deg,var(--blue),var(--blue-l));color:#fff}.ic.amber{background:linear-gradient(135deg,var(--amber),#f6bd78);color:#fff}.ic.soft{background:var(--tint);color:var(--navy)}
.codeblock{background:#0b1a30;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:20px 22px;font-family:var(--fc);font-size:13.5px;color:#e6f2fb;line-height:1.55;box-shadow:var(--shadow)}
.codeblock .k{color:var(--blue-l);font-weight:600}.codeblock .c{color:#93a7bd;font-style:italic}.codeblock .h{background:rgba(87,182,221,.14);padding:2px 6px;border-radius:5px}
.codehead{display:flex;align-items:center;gap:8px;font-size:11px;color:#7fa1c0;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;font-family:var(--fb);font-weight:700}
.codehead .dot{width:9px;height:9px;border-radius:50%}.codehead .dot.r{background:#ff5f56}.codehead .dot.y{background:#ffbd2e}.codehead .dot.g{background:#27c93f}
.slide .anim{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.3,1),transform .6s cubic-bezier(.2,.7,.3,1)}
.slide.active .anim{opacity:1;transform:none}
.ctl{position:fixed;z-index:50;display:flex;align-items:center;gap:14px;bottom:22px;left:50%;transform:translateX(-50%);background:rgba(6,18,34,.66);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);padding:8px 14px;border-radius:999px;color:#cfe0ee;font-size:13px;font-weight:600}
.ctl button{all:unset;cursor:pointer;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#dbe9f6}.ctl button:hover{background:rgba(255,255,255,.12)}
.progress{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--blue),var(--blue-l));z-index:60;transition:width .4s ease}
.hint{position:fixed;top:14px;right:16px;z-index:50;color:#7f9bb5;font-size:12px}
.codehead .cp{margin-left:auto;font-family:var(--fb);font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:none;color:#d6ebf8;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:4px 12px;cursor:pointer;transition:background .2s ease}.codehead .cp:hover{background:#0090C0;border-color:#0090C0;color:#fff}.codehead .cp.ok{background:#1F8A5B;border-color:#1F8A5B;color:#fff}
.dl-mat{margin-top:12px;align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#0090C0,#003C78);color:#fff;font-family:var(--fd);font-weight:700;font-size:13px;padding:9px 16px;border-radius:999px;text-decoration:none;box-shadow:var(--shadow-sm);transition:transform .2s ease}.dl-mat:hover{transform:translateY(-2px)}
</style></head>
<body>
<div class="progress" id="progress"></div><div class="hint">← → · F pantalla completa</div>
<div class="viewport"><div class="deck" id="deck"><div class="stage" id="stage"></div></div></div>
<div class="ctl"><button id="prev"><i data-lucide="chevron-left"></i></button><span><span id="cur">1</span> / <span id="total">1</span></span><button id="next"><i data-lucide="chevron-right"></i></button></div>
<script>
const LOGO="logo_myworkin.png";const LOGO_VV="media/logo_vivargo.svg";const SEC="FullDay · Claude e IA para el trabajo · Grupo Vivargo";
function ic(n,c,s=22){return `<span class="ic ${c}" style="width:${s+22}px;height:${s+22}px"><i data-lucide="${n}" style="width:${s}px;height:${s}px"></i></span>`}
function footer(t){return `<div class="footer anim"><span>${SEC}</span><span class="sec">${t}</span></div>`}
function titlebar(k,t){return `<div class="titlebar anim"><div class="kicker"><span class="bar"></span>${k}</div><h1 class="title">${t}</h1></div>`}
function brand(){return `<span class="brandmark cobrand"><img src="${LOGO}" class="logo white" alt="MyWorkIn"><span class="cb-sep"></span><img src="${LOGO_VV}" class="logo vv" alt="Grupo Vivargo"></span>`}
function code(h,b){return `<div class="codeblock anim"><div class="codehead"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span>${h}</span></div>${b}</div>`}
const slides=[];

/* 1 · Cover */
slides.push(`<div class="slide bg-dark"><div class="pad">
  <div class="kicker anim"><span class="bar"></span>FullDay · Bloque 4</div>
  <h1 class="title anim" style="font-size:70px;margin-top:14px;max-width:22ch">Projects, Skills y memoria de trabajo</h1>
  <p class="lead anim" style="font-size:22px;margin-top:16px">Que Claude deje de responder como IA genérica — y empiece a trabajar como parte de tu sistema.</p>
  <div class="anim" style="margin-top:20px;color:#9fc4de;font-size:14px">30 minutos</div>
  ${brand()}
</div></div>`);

/* 2 · El problema */
slides.push(`<div class="slide bg-light"><div class="pad" style="justify-content:center">
  <div class="kicker anim"><span class="bar"></span>El problema</div>
  <h1 class="title anim" style="font-size:52px;margin-top:14px;max-width:26ch;line-height:1.15">Empezar desde cero <span style="color:var(--blue)">cada vez</span> que abres una conversación.</h1>
  <div class="anim" style="margin-top:26px;background:linear-gradient(160deg,var(--navy),#0a5390);border-radius:16px;padding:24px 28px;color:#fff;max-width:900px;box-shadow:var(--shadow)">
    ${ic('rewind','blue',22)}
    <p style="font-family:var(--fd);font-weight:700;font-size:19px;margin-top:12px;line-height:1.4">Volver a pegar el contexto. Volver a explicar quién soy. Volver a decir cómo escribo. Volver a subir los mismos archivos.</p>
  </div>
  <p class="lead anim" style="margin-top:22px;max-width:60ch">Es como tener un asistente <b style="color:var(--navy)">nuevo cada día</b>.</p>
  ${footer("El problema")}
</div></div>`);

/* 3 · Projects */
slides.push(`<div class="slide bg-tint"><div class="pad">
  ${titlebar("Projects","Contexto persistente — Claude ya sabe con quién trabaja")}
  <div style="display:flex;gap:22px;margin-top:20px;flex:1;align-items:stretch">
    <div class="anim" style="flex:1.1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow-sm)">
      <div style="display:flex;align-items:center;gap:12px">${ic('folder-open','navy',18)}<span style="font-family:var(--fd);font-weight:800;font-size:22px;color:var(--navy)">Qué le subes</span></div>
      <ul style="margin-top:14px;padding-left:20px;color:var(--ink);font-size:14.5px;line-height:1.8;list-style:disc">
        <li>Documentos clave de tu empresa</li>
        <li>Playbooks, manuales, propuestas modelo</li>
        <li>Presentaciones, informes anteriores</li>
        <li>Datos de referencia estables</li>
      </ul>
    </div>
    <div class="anim" style="flex:1;background:linear-gradient(160deg,var(--navy),#0a5390);border-radius:16px;padding:24px;color:#fff;box-shadow:var(--shadow-sm)">
      <div style="display:flex;align-items:center;gap:12px">${ic('scroll-text','blue',18)}<span style="font-family:var(--fd);font-weight:800;font-size:22px">Instrucciones del Project</span></div>
      <p style="color:#d6ebf8;font-size:14.5px;margin-top:12px;line-height:1.55">Qué debe recordar Claude siempre en este espacio: quién eres, qué haces, cómo quieres que responda, qué evitar.</p>
    </div>
  </div>
  <p class="anim" style="text-align:center;font-family:var(--fd);font-style:italic;font-weight:700;color:var(--navy);font-size:14.5px;margin-top:14px">En Vivargo: Project de Comercial Alquiler · de Venta JLG · de Almacenes · de Seguridad · de Flota.</p>
  ${footer("Bloque 4")}
</div></div>`);

/* 3a · Ejemplos de Projects */
slides.push(`<div class="slide bg-light"><div class="pad">
  ${titlebar("Ejemplos de Projects en Vivargo","Espacios de trabajo con contexto propio — uno por cada frente del negocio")}
  <p class="lead anim" style="margin-top:4px">Uno para cada tema recurrente — cada Project le da a Claude un mundo distinto en el que trabajar.</p>
  <div class="grid anim" style="grid-template-columns:repeat(3,1fr);margin-top:22px;gap:14px;flex:1;align-items:stretch">
  ${[
    ["truck","Comercial Alquiler","catálogo de flota, tarifario, condiciones, propuestas modelo"],
    ["shopping-cart","Venta JLG","fichas técnicas, argumentario, preguntas frecuentes"],
    ["warehouse","Administración de almacenes","procedimientos, inventarios, reportes al cliente"],
    ["hard-hat","Seguridad · planes de izaje","listas de verificación, normas, lecciones aprendidas"],
    ["wrench","Operaciones de flota","mantenimientos, certificaciones, disponibilidad"],
    ["folder-plus","El de tu área","lo que hoy explicas cada vez que abres un chat"]
  ].map(c=>`<div style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;box-shadow:var(--shadow-sm)">${ic(c[0],'blue',16)}<div style="font-family:var(--fd);font-weight:700;font-size:15px;color:var(--navy);margin-top:12px">${c[1]}</div><div style="font-size:12.5px;color:var(--gray);margin-top:4px">${c[2]}</div></div>`).join("")}
  </div>
  ${footer("Ejemplos · Projects")}
</div></div>`);

/* 3b · Demo Project — Comercial Alquiler · Vivargo */
slides.push(`<div class="slide bg-tint"><div class="pad">
  ${titlebar("Demo · Comercial Alquiler","Un Project con todo el contexto del área — responde con nuestra flota y tarifas, no con generalidades")}
  <div style="display:flex;gap:22px;margin-top:12px;flex:1;align-items:stretch">
    <div class="anim" style="flex:0.95;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;gap:10px">${ic('folder-open','navy',15)}<div><div style="font-family:var(--fd);font-weight:800;font-size:15.5px;color:var(--navy)">Project · Comercial Alquiler · Vivargo</div><div style="font-size:11px;color:var(--gray)">Grúas, manlifts, telehandlers, montacargas y camas bajas</div></div></div>
      <div style="font-family:var(--fd);font-weight:700;font-size:10.5px;color:var(--gray);letter-spacing:1.5px;text-transform:uppercase;margin-top:12px">Lo que el Project ya sabe</div>
      <div style="display:flex;flex-direction:column;gap:7px;margin-top:8px">
      ${[
        ["user-round","Trabajo en el área comercial de alquiler","cotizo, armo propuestas, coordino el ingreso a mina"],
        ["factory","Clientes de minería, energía y construcción","en Perú, Chile, Ecuador y Estados Unidos"],
        ["scroll-text","Cómo responder","primero el número · montos con moneda y si incluyen IGV"]
      ].map(c=>`<div style="display:flex;align-items:center;gap:11px;background:var(--tint);border-radius:8px;padding:8px 11px"><i data-lucide="${c[0]}" style="width:13px;height:13px;color:var(--blue);flex:none"></i><div style="min-width:0"><div style="font-family:var(--fd);font-weight:700;font-size:12.5px;color:var(--navy)">${c[1]}</div><div style="font-size:11px;color:var(--gray)">${c[2]}</div></div></div>`).join("")}
      </div>
      <div style="font-family:var(--fd);font-weight:700;font-size:10.5px;color:var(--gray);letter-spacing:1.5px;text-transform:uppercase;margin-top:12px">Los 6 documentos del Project</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">
      ${["01 · Catálogo de flota","02 · Tarifario 2026","03 · Condiciones comerciales","04 · Requisitos de ingreso a mina","05 · Propuesta modelo","06 · Glosario"].map(t=>`<span style="background:var(--tint);color:var(--navy);border-radius:999px;padding:4px 10px;font-size:10.5px;font-weight:600">${t}</span>`).join("")}
      </div>
      <div style="font-family:var(--fd);font-weight:700;font-size:10.5px;color:var(--gray);letter-spacing:1.5px;text-transform:uppercase;margin-top:12px">Instrucciones del Project · extracto</div>
      <p style="font-size:11.5px;color:var(--gray);margin-top:6px;line-height:1.45;font-style:italic">"<b>Si un dato no está en los archivos del Project, dilo: «Ese dato no está en el Project; confírmalo con Operaciones». Nunca lo estimes.</b> Nunca afirmes que un equipo puede hacer un izaje específico. No confirmes disponibilidad de equipos."</p>
      <a class="dl-mat" href="https://firebasestorage.googleapis.com/v0/b/myworkin-b2c.firebasestorage.app/o/vivargo%2FProject_Comercial_Alquiler.zip?alt=media&amp;token=2181c7fb-c2d3-4cd3-b013-e504ad7a2af7" target="_blank" rel="noopener" onclick="event.stopPropagation()"><i data-lucide="download" style="width:15px;height:15px"></i> Descargar material del Project</a>
    </div>
    <div class="anim" style="flex:1.05;display:flex;flex-direction:column;justify-content:center">
    ${code("Prompt · una solicitud real del lunes",`<span style="white-space:pre-wrap"><span class="k h">Un cliente minero necesita un manlift para
trabajar a 25 m en planta concentradora.</span>

<span class="c">Sin pegar contexto: el Project ya tiene la flota.</span>

¿Qué equipo le propongo y <span class="k">qué documentos
necesita</span> para ingresar a la unidad?

Dame:
· El equipo candidato y su tarifa, con moneda e IGV
· Los requisitos del equipo y del operador
· El plazo de acreditación que debo advertirle

Y aparte: ¿cuánto cobramos en <span class="k">Chile</span>?
<span class="c">(no está en el Project: tiene que decirlo)</span></span>`)}
    </div>
  </div>
  ${footer("Demo · Project")}
</div></div>`);

/* 3c · Modelo mental — el Project como caja que alimentas */
slides.push(`<div class="slide bg-light"><div class="pad">
  ${titlebar("La idea clave · Projects","Un Project es una caja: la llenas una vez y sirve a cada chat que abras dentro")}
  <div style="display:flex;gap:16px;margin-top:14px;flex:1;align-items:stretch">

    <!-- IZQUIERDA · le alimentas info -->
    <div class="anim" style="flex:0.92;display:flex;flex-direction:column;justify-content:center;gap:9px">
      <div style="font-family:var(--fd);font-weight:800;font-size:13.5px;color:var(--navy);display:flex;align-items:center;gap:8px">${ic('plus-circle','blue',13)}La vas alimentando</div>
      ${[
        ["file-text","Archivos y documentos"],
        ["scroll-text","Instrucciones del Project"],
        ["database","Datos de contexto"],
        ["history","Informes y casos previos"]
      ].map(c=>`<div style="display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;box-shadow:var(--shadow-sm)"><i data-lucide="${c[0]}" style="width:14px;height:14px;color:var(--blue)"></i><span style="font-size:12.5px;color:var(--ink);font-weight:600">${c[1]}</span></div>`).join("")}
    </div>

    <div class="anim" style="align-self:center;color:var(--blue-l)"><i data-lucide="arrow-right" style="width:28px;height:28px"></i></div>

    <!-- CENTRO · la caja -->
    <div class="anim" style="flex:1.18;background:linear-gradient(160deg,var(--navy),#0a5390);border-radius:18px;padding:22px;color:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative">
      <div style="position:absolute;top:13px;right:13px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.13);border-radius:999px;padding:4px 10px;font-size:10px;font-weight:800;letter-spacing:.5px;color:var(--blue-l)"><i data-lucide="infinity" style="width:12px;height:12px"></i>PERSISTENTE</div>
      ${ic('box','blue',30)}
      <div style="font-family:var(--fd);font-weight:800;font-size:25px;margin-top:12px">Project</div>
      <div style="font-size:12.5px;color:#bcd6ec;margin-top:6px;line-height:1.5;max-width:26ch">Una caja que llenas una vez — y sigue ahí cuando abres otro chat. No se borra ni se reinicia.</div>
      <div style="display:flex;gap:6px;margin-top:14px">
        ${["file","file","file","scroll-text"].map(i=>`<span style="width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.13);display:flex;align-items:center;justify-content:center"><i data-lucide="${i}" style="width:14px;height:14px;color:#fff"></i></span>`).join("")}
      </div>
    </div>

    <div class="anim" style="align-self:center;color:var(--blue-l)"><i data-lucide="arrow-right" style="width:28px;height:28px"></i></div>

    <!-- DERECHA · cada chat nuevo la usa -->
    <div class="anim" style="flex:0.92;display:flex;flex-direction:column;justify-content:center;gap:9px">
      <div style="font-family:var(--fd);font-weight:800;font-size:13.5px;color:var(--navy);display:flex;align-items:center;gap:8px">${ic('messages-square','blue',13)}Cada chat nuevo la usa</div>
      ${["Chat nuevo · hoy","Chat nuevo · otra duda","Chat nuevo · en dos semanas"].map(t=>`<div style="display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;box-shadow:var(--shadow-sm)"><i data-lucide="message-circle" style="width:14px;height:14px;color:var(--blue)"></i><span style="font-size:12.5px;color:var(--ink);font-weight:600">${t}</span></div>`).join("")}
      <div style="font-size:11px;color:var(--gray);font-style:italic;margin-top:2px;line-height:1.45;display:flex;align-items:flex-start;gap:6px"><i data-lucide="lock" style="width:12px;height:12px;color:var(--blue);flex:none;margin-top:2px"></i>Mientras sea dentro del Project, siempre parte con esta info.</div>
    </div>
  </div>

  <!-- BANDA · la receta de cada prompt -->
  <div class="anim" style="margin-top:13px;background:var(--tint);border:1px solid var(--line);border-radius:14px;padding:13px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center">
    <span style="font-family:var(--fd);font-weight:800;font-size:13px;color:var(--navy)">En cada prompt, Claude combina:</span>
    ${[
      ["folder","Tu info del Project"],

function show(n){n=Math.max(0,Math.min(els.length-1,n));els.forEach((s,i)=>s.classList.toggle('active',i===n));idx=n;document.getElementById('cur').textContent=n+1;document.getElementById('progress').style.width=((n+1)/els.length*100)+'%';els[n].querySelectorAll('.anim').forEach((el,k)=>el.style.transitionDelay=(0.04+k*0.05)+'s');if(window.lucide)lucide.createIcons()}
document.getElementById('next').onclick=()=>show(idx+1);document.getElementById('prev').onclick=()=>show(idx-1);

stage.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.5)show(idx+1);else show(idx-1)});

/* Botón «Copiar» en cada bloque de prompt: copia el texto sin la cabecera. */
(function(){
  function copiar(txt,btn){
    var ok=function(){btn.textContent='Copiado ✓';btn.classList.add('ok');
      setTimeout(function(){btn.textContent='Copiar';btn.classList.remove('ok')},1800)};
    var legacy=function(){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';
      ta.style.opacity='0';document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');ok()}finally{ta.remove()}};
    if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(ok,legacy);else legacy();
  }
  document.querySelectorAll('.codeblock').forEach(function(cb){
    var head=cb.querySelector('.codehead');
    if(!head||head.querySelector('.cp'))return;
    var b=document.createElement('button');b.type='button';b.className='cp';b.textContent='Copiar';
    b.addEventListener('click',function(e){
      e.stopPropagation();
      head.style.display='none';var txt=cb.innerText.trim();head.style.display='';
      copiar(txt,b);
    });
    head.appendChild(b);
  });
})();
</script>
