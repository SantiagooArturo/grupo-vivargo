<!doctype html>
<html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>FullDay P3 — Claude Chat + prompting · MyWorkIn × Grupo Vivargo</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--navy:#003C78;--blue:#0090C0;--blue-l:#57B6DD;--tint:#EAF3FA;--ink:#132a47;--gray:#5B6B7B;--line:#dbe6ef;--amber:#F2A23C;--shadow:0 18px 40px -18px rgba(2,30,60,.45);--shadow-sm:0 8px 22px -12px rgba(2,30,60,.35);--fd:'Sora',sans-serif;--fb:'Inter',sans-serif;--fc:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05101f;font-family:var(--fb);-webkit-font-smoothing:antialiased;overflow:hidden}
.viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#0a1f3a,#05101f 75%)}
.deck{position:relative;transform-origin:center center}
.stage{position:relative;width:1280px;height:720px;border-radius:18px;overflow:hidden;box-shadow:0 40px 120px -30px rgba(0,0,0,.8)}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .55s ease,transform .55s ease;transform:scale(1.02);overflow:hidden}
.slide.active{opacity:1;visibility:visible;transform:scale(1)}
.pad{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column}
.bg-light{background:radial-gradient(1200px 500px at 88% -10%,rgba(0,144,192,.10),transparent 60%),linear-gradient(180deg,#fff,#f3f8fc)}
.bg-tint{background:radial-gradient(900px 500px at 90% 110%,rgba(0,144,192,.10),transparent 60%),linear-gradient(180deg,#f6fafd,#eef5fb)}
.bg-dark{background:radial-gradient(900px 600px at 82% 8%,rgba(87,182,221,.30),transparent 55%),radial-gradient(700px 500px at 10% 100%,rgba(0,144,192,.22),transparent 60%),linear-gradient(135deg,#01244a,#003C78 58%,#0a5390)}
.bg-dark2{background:radial-gradient(800px 600px at 85% 12%,rgba(87,182,221,.22),transparent 55%),linear-gradient(150deg,#01182f,#012a52 70%)}
.kicker{font-family:var(--fb);font-weight:700;font-size:14px;letter-spacing:3px;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:10px}
.bg-dark .kicker,.bg-dark2 .kicker{color:var(--blue-l)}
.kicker .bar{width:34px;height:3px;border-radius:3px;background:currentColor}
h1.title{font-family:var(--fd);font-weight:800;color:var(--navy);font-size:42px;line-height:1.08;letter-spacing:-.5px;margin-top:14px}
.bg-dark h1.title,.bg-dark2 h1.title{color:#fff}
.lead{font-size:18px;color:var(--gray);margin-top:12px;max-width:62ch;line-height:1.5}
.bg-dark .lead,.bg-dark2 .lead{color:#bcd6ec}
.logo{height:40px}.logo.white{filter:brightness(0) invert(1)}
.brandmark{position:absolute;right:60px;bottom:34px;height:30px;opacity:.95}.brandmark.cobrand{display:flex;align-items:center;gap:14px}.brandmark.cobrand img{height:26px;width:auto}.cb-sep{width:1px;height:22px;background:rgba(255,255,255,.35)}.logo-plate{align-items:center;gap:18px;align-self:flex-start}.logo-plate .vv{filter:brightness(0)}.logo-plate .cb-sep{background:#d5dbe2;height:34px}
.footer{position:absolute;left:72px;right:72px;bottom:26px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--gray);border-top:1px solid var(--line);padding-top:10px}
.footer .sec{color:var(--blue);font-weight:700}
.bg-dark .footer,.bg-dark2 .footer{border-color:rgba(255,255,255,.14);color:#9fc0dc}.bg-dark .footer .sec,.bg-dark2 .footer .sec{color:var(--blue-l)}
.grid{display:grid;gap:18px}
.ic{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none}.ic svg{stroke-width:2.1}
.ic.navy{background:var(--navy);color:#fff}.ic.blue{background:linear-gradient(135deg,var(--blue),var(--blue-l));color:#fff}.ic.amber{background:linear-gradient(135deg,var(--amber),#f6bd78);color:#fff}.ic.soft{background:var(--tint);color:var(--navy)}.ic.ghost{background:rgba(255,255,255,.14);color:#fff}
.codeblock{background:#0b1a30;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:20px 22px;font-family:var(--fc);font-size:13.5px;color:#e6f2fb;line-height:1.55;box-shadow:var(--shadow)}
.codeblock .k{color:var(--blue-l);font-weight:600}.codeblock .c{color:#93a7bd;font-style:italic}.codeblock .h{background:rgba(87,182,221,.14);padding:2px 6px;border-radius:5px}
.codehead{display:flex;align-items:center;gap:8px;font-size:11px;color:#7fa1c0;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;font-family:var(--fb);font-weight:700}
.codehead .dot{width:9px;height:9px;border-radius:50%}.codehead .dot.r{background:#ff5f56}.codehead .dot.y{background:#ffbd2e}.codehead .dot.g{background:#27c93f}
.slide .anim{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.3,1),transform .6s cubic-bezier(.2,.7,.3,1)}
.slide.active .anim{opacity:1;transform:none}
.ctl{position:fixed;z-index:50;display:flex;align-items:center;gap:14px;bottom:22px;left:50%;transform:translateX(-50%);background:rgba(6,18,34,.66);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);padding:8px 14px;border-radius:999px;color:#cfe0ee;font-size:13px;font-weight:600}
.ctl button{all:unset;cursor:pointer;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#dbe9f6}.ctl button:hover{background:rgba(255,255,255,.12)}
.progress{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--blue),var(--blue-l));z-index:60;transition:width .4s ease}
.hint{position:fixed;top:14px;right:16px;z-index:50;color:#7f9bb5;font-size:12px}
</style></head>
<body>
<div class="progress" id="progress"></div><div class="hint">← → · F pantalla completa</div>
<div class="viewport"><div class="deck" id="deck"><div class="stage" id="stage"></div></div></div>
<div class="ctl"><button id="prev"><i data-lucide="chevron-left"></i></button><span><span id="cur">1</span> / <span id="total">1</span></span><button id="next"><i data-lucide="chevron-right"></i></button></div>
<script>
const LOGO="logo_myworkin.png";const LOGO_VV="media/logo_vivargo.svg";const SEC="FullDay · Claude e IA para el trabajo · Grupo Vivargo";
function ic(n,c,s=22){return `<span class="ic ${c}" style="width:${s+22}px;height:${s+22}px"><i data-lucide="${n}" style="width:${s}px;height:${s}px"></i></span>`}
function footer(t){return `<div class="footer anim"><span>${SEC}</span><span class="sec">${t}</span></div>`}
function titlebar(k,t){return `<div class="titlebar anim"><div class="kicker"><span class="bar"></span>${k}</div><h1 class="title">${t}</h1></div>`}
function brand(){return `<span class="brandmark cobrand"><img src="${LOGO}" class="logo white" alt="MyWorkIn"><span class="cb-sep"></span><img src="${LOGO_VV}" class="logo vv" alt="Grupo Vivargo"></span>`}
function code(h,b){return `<div class="codeblock anim"><div class="codehead"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span>${h}</span></div>${b}</div>`}
const slides=[];

/* 1 · Cover */
slides.push(`<div class="slide bg-dark"><div class="pad">
  <div class="kicker anim"><span class="bar"></span>FullDay · Bloque 3</div>
  <h1 class="title anim" style="font-size:70px;margin-top:14px;max-width:22ch">Claude Chat + prompting profesional</h1>
  <p class="lead anim" style="font-size:22px;margin-top:16px">El punto de partida — y la habilidad que más va a impactar tu trabajo esta semana.</p>
  <div class="anim" style="margin-top:20px;color:#9fc4de;font-size:14px">40 minutos</div>
  ${brand()}
</div></div>`);

/* 2 · Claude Chat: el punto de partida */
slides.push(`<div class="slide bg-light"><div class="pad">
  ${titlebar("Claude Chat","El punto de partida — el 80% del valor está aquí")}
  <p class="lead anim" style="margin-top:4px">Antes de Projects, Skills, Cowork o Schedule Tasks — todo empieza con una conversación.</p>
  <div class="grid anim" style="grid-template-columns:1fr 1fr 1fr 1fr;margin-top:26px;gap:14px;flex:1;align-items:stretch">
  ${[["message-square","Pregunta abierta"],["file-edit","Redacción"],["search","Análisis rápido"],["compass","Decidir mejor"]].map(c=>`<div style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:var(--shadow-sm)">${ic(c[0],'blue',18)}<div style="font-family:var(--fd);font-weight:700;font-size:14.5px;color:var(--navy);margin-top:12px">${c[1]}</div></div>`).join("")}
  </div>
  <p class="anim" style="text-align:center;font-family:var(--fd);font-style:italic;font-weight:700;color:var(--navy);font-size:15px;margin-top:16px">Si dominas esto — ya cambiaste tu forma de trabajar.</p>
  ${footer("Bloque 3")}
</div></div>`);

/* 3 · El error más común */
slides.push(`<div class="slide bg-dark2"><div class="pad" style="justify-content:center">
  <div class="kicker anim"><span class="bar"></span>El error más común</div>
  <h1 class="title anim" style="font-size:52px;margin-top:14px;max-width:28ch;line-height:1.15">Pedir cosas <span style="color:var(--amber)">vagas</span> — y luego culpar a la IA por respuestas vagas.</h1>
  <p class="lead anim" style="font-size:20px;margin-top:24px;max-width:60ch">La IA no adivina. No sabe para quién es, cuál es el contexto, ni qué tono usar.</p>
  ${brand()}
</div></div>`);

/* 4 · Vago vs profesional */
slides.push(`<div class="slide bg-light"><div class="pad">
  ${titlebar("Prompt vago vs. prompt profesional","Mismo problema — dos resultados muy distintos")}
  <div style="display:flex;gap:22px;margin-top:16px;flex:1;align-items:stretch">
    <div class="anim" style="flex:1;display:flex;flex-direction:column;justify-content:center">
    ${code("Prompt vago",`<div style="white-space:pre-line"><span class="c"># Lo que la mayoría escribe</span>
Escríbeme un correo para
mandar una cotización
de una grúa.</div>`)}
    </div>
    <div class="anim" style="flex:1.3;display:flex;flex-direction:column;justify-content:center">
    ${code("Prompt profesional · los 5 ingredientes",`<div style="white-space:pre-line"><span class="k">ROL:</span> Actúa como ejecutivo comercial de
alquiler de equipos de izaje.

<span class="k">CONTEXTO:</span> Una minera nos pidió una grúa
telescópica para su parada de planta (cambio
del motor del molino, 18 t). Cotizamos una
GT-90 con operador por 12 días.

<span class="k">TAREA:</span> Escribe el correo que acompaña
la propuesta y consigue la visita técnica.

<span class="k">FORMATO:</span> Máximo 150 palabras.
Incluye asunto del correo.

<span class="k">CRITERIO DE ÉXITO:</span> Profesional y cercano.
No prometas capacidades: se validan con
el plan de izaje.</div>`)}
    </div>
  </div>
  ${footer("Bloque 3")}
</div></div>`);

/* 5 · Los 5 ingredientes */
slides.push(`<div class="slide bg-tint"><div class="pad">
  ${titlebar("Los 5 ingredientes","De un buen prompt profesional")}
  <div style="display:flex;flex-direction:column;gap:12px;margin-top:22px;flex:1;justify-content:center">
  ${[
    ["1","Rol","¿Quién debe ser Claude?","user"],
    ["2","Contexto","¿Qué está pasando?","book"],
    ["3","Tarea","¿Qué debe hacer exactamente?","target"],
    ["4","Formato","¿Cómo debe responder?","layout"],
    ["5","Criterio de éxito","¿Qué hace buena la respuesta?","award"]
  ].map(c=>`<div class="anim" style="display:flex;align-items:center;gap:18px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 22px;box-shadow:var(--shadow-sm)">
     <span style="font-family:var(--fd);font-weight:800;font-size:30px;color:var(--blue);min-width:34px">${c[0]}</span>
     ${ic(c[3],'navy',14)}
     <span style="font-family:var(--fd);font-weight:700;font-size:18px;color:var(--navy);min-width:220px">${c[1]}</span>
     <span style="font-size:14.5px;color:var(--gray)">${c[2]}</span>
  </div>`).join("")}
  </div>
  ${footer("Bloque 3")}
</div></div>`);

/* 5.5 · Cuando la respuesta no sale bien */
slides.push(`<div class="slide bg-light"><div class="pad">
  ${titlebar("Cuando la respuesta no sale bien","Cuatro arreglos — según lo que te pasó")}
  <div class="grid anim" style="grid-template-columns:1fr 1fr;margin-top:20px;gap:16px;flex:1;align-items:stretch">
  ${[
    ["user-cog","Me responde muy genérico, como de enciclopedia.","Dale un rol y contexto.",
     `Actúa como <b>director financiero de una PYME peruana</b>.<br>Revisa este flujo de caja y dime los 3 riesgos mayores.`,
     "en inglés: role prompting"],
    ["copy","No me lo entrega en el formato que quiero.","Muéstrale 2 ejemplos en vez de explicárselo.",
     `Etiqueta el sentimiento:<br>"Llegó tarde" → negativo<br>"Excelente servicio" → positivo<br>"Es un producto" → ?`,
     "en inglés: few-shot"],
    ["list-ordered","Se equivoca cuando hay varios pasos.","Pídele que piense antes de responder.",
     `Antes de darme el total, <b>escribe el cálculo paso a paso</b>.<br>Recién después dame la respuesta final.`,
     "en inglés: chain of thought"],
    ["message-square-warning","Me dice que todo está bien.","Pídele que critique o que argumente en contra.",
     `Critica esta propuesta como un comité de compras exigente.<br><b>Sé duro. No seas complaciente.</b>`,
     "en inglés: critic mode · devil's advocate"]
  ].map(t=>`<div style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;box-shadow:var(--shadow-sm)">
     <div style="font-size:13.5px;color:var(--gray);font-style:italic;line-height:1.4">"${t[1]}"</div>
     <div style="display:flex;align-items:center;gap:11px;margin-top:12px">${ic(t[0],'blue',14)}<span style="font-family:var(--fd);font-weight:800;font-size:16.5px;color:var(--navy);line-height:1.25">${t[2]}</span></div>
     <div style="background:#0b1a30;border-radius:8px;padding:10px 13px;margin-top:11px;font-family:var(--fc);font-size:11px;color:#cfe6f5;line-height:1.6;font-style:italic">${t[3]}</div>
     <div style="font-size:10px;color:#9bb0c4;margin-top:9px;letter-spacing:.3px">${t[4]}</div>
  </div>`).join("")}
  </div>
  <p class="anim" style="text-align:center;font-family:var(--fd);font-style:italic;font-weight:700;color:var(--navy);font-size:14.5px;margin-top:14px">No memorices las técnicas. Reconoce el síntoma — y aplica el arreglo.</p>
  ${footer("Bloque 3 · Técnicas")}
</div></div>`);

/* 6 · Demo 1 — correo comercial */
slides.push(`<div class="slide bg-light"><div class="pad">
  ${titlebar("Demo 1 · Correo de propuesta","Los 5 ingredientes en un caso de Vivargo")}
  <div class="anim" style="margin-top:18px;flex:1;display:flex;align-items:center">
    ${code("Prompt · correo de propuesta · datos ficticios",`<div style="white-space:pre-line">Actúa como <span class="k h">ejecutivo comercial de alquiler de equipos de izaje</span>.

Escribe el correo que acompaña la propuesta VIV-ALQ-2026-0418
para la Ing. Carla Núñez, Jefa de Mantenimiento de Planta
de Minera Andes del Sur.

<span class="c">Contexto:</span>
Parada de planta del 5 al 16 de octubre: cambio del motor del
molino (18 t). Proponemos una grúa telescópica GT-90 con
operador, 12 días. Total: US$ 24,450 sin IGV.

<span class="c">Objetivo:</span> agendar la <span class="k">visita técnica sin costo</span> para medir radios.
<span class="c">Tono:</span> profesional, cercano y directo.
<span class="c">Formato:</span> máximo 150 palabras. Incluye asunto del correo.
<span class="c">Cuidado:</span> no afirmes capacidades; se validan con el plan de izaje.</div>`)}
  </div>
  ${footer("Demo 1 · Correo")}
</div></div>`);

/* 9 · Plantilla base */
slides.push(`<div class="slide bg-tint"><div class="pad">
  ${titlebar("Plantilla base","Cópiala. Pégala. Rellénala.")}
  <div style="margin-top:18px;flex:1;display:flex;gap:20px;align-items:center">
    <div class="anim" style="flex:1;min-width:0">
    ${code("Plantilla · prompt profesional",`<div style="white-space:pre-line"><span class="k">ROL:</span> Actúa como [rol / experto].

<span class="k">CONTEXTO:</span>
[Quién soy, qué está pasando]

<span class="k">TAREA:</span>
[Qué debe hacer exactamente]

<span class="k">FORMATO:</span>
[Bullets, tabla, longitud…]

<span class="k">CRITERIO DE ÉXITO:</span>
[Tono, para quién es, qué debe lograr]</div>`)}
    </div>
    <div class="anim" style="flex:1.25;min-width:0">
    ${code("Ejemplo · Vivargo",`<div style="white-space:pre-line"><span class="k">ROL:</span> Actúa como ejecutivo comercial de
alquiler de equipos de izaje.

<span class="k">CONTEXTO:</span>
Un cliente minero dice que nuestra tarifa
de la GT-90 está por encima de otra oferta.

<span class="k">TAREA:</span>
Prepara 3 argumentos de valor y la respuesta.

<span class="k">FORMATO:</span>
Tabla de argumentos + correo de máx. 120 palabras.

<span class="k">CRITERIO DE ÉXITO:</span>
Sin bajar el precio de entrada. Que resalte
seguridad, operador y acreditación para mina.</div>`)}
    </div>
  </div>
  ${footer("Plantilla")}
</div></div>`);

/* 9.5 · Tip extra — voz */
slides.push(`<div class="slide bg-light"><div class="pad">
  ${titlebar("Tip extra","También puedes hablárselo a Claude")}
  <p class="lead anim" style="margin-top:4px">Cuando no tengas ganas de escribir el prompt completo, díctaselo. Dos formas distintas, según lo que necesites:</p>
  <div class="grid anim" style="grid-template-columns:1fr 1fr;margin-top:22px;gap:18px;flex:1;align-items:stretch">
    <div style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;box-shadow:var(--shadow-sm)">
      ${ic('mic','blue',20)}
      <div style="font-family:var(--fd);font-weight:800;font-size:19px;color:var(--navy);margin-top:14px">Dictado</div>
      <div style="font-size:13.5px;color:var(--gray);margin-top:8px;line-height:1.5">Convierte tu voz en texto. Tú revisas y envías el mensaje — Claude responde por escrito, como siempre.</div>
      <div style="margin-top:auto;padding-top:16px;font-size:12.5px;color:var(--blue);font-weight:700">Móvil (iOS y Android) · ícono del micrófono en el chat</div>
    </div>
    <div style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;box-shadow:var(--shadow-sm)">
      ${ic('audio-lines','blue',20)}
      <div style="font-family:var(--fd);font-weight:800;font-size:19px;color:var(--navy);margin-top:14px">Modo voz</div>
      <div style="font-size:13.5px;color:var(--gray);margin-top:8px;line-height:1.5">Conversación hablada completa: tú hablas, Claude te responde hablando. Ideal para pensar en voz alta.</div>
      <div style="margin-top:auto;padding-top:16px;font-size:12.5px;color:var(--blue);font-weight:700">Móvil, escritorio y web · ícono de onda de sonido</div>
    </div>
  </div>
  <p class="anim" style="text-align:center;font-family:var(--fd);font-style:italic;font-weight:700;color:var(--navy);font-size:14.5px;margin-top:16px">Recomendado: dicta el contexto completo cuando tengas la idea clara, pero flojera de escribir un prompt largo.</p>
  ${footer("Tip extra · Voz")}
</div></div>`);

/* 10 · Buenas prácticas */
slides.push(`<div class="slide bg-light"><div class="pad">
  ${titlebar("Buenas prácticas","Al conversar con Claude — como con un colega experto")}
  <div class="grid anim" style="grid-template-columns:1fr 1fr;margin-top:22px;gap:14px;flex:1;align-items:stretch">
  ${[
    ["message-circle","Dale contexto","como se lo darías a alguien nuevo del equipo"],
    ["refresh-ccw","Iterá","ajustá con cada respuesta — no escribas prompts perfectos de una"],
    ["file-text","Pedile formato","tabla, bullets, mail, resumen — nombra lo que quieres"],
    ["ban","No copies datos sensibles","piensa dos veces qué compartes"],
    ["shield-check","Verifica lo importante","cifras, nombres, fechas, citas legales"],
    ["timer","Cortá temprano","si va por mal camino, empezá de nuevo con más contexto"]
  ].map(c=>`<div style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-sm);min-width:0">${ic(c[0],'blue',14)}<div><div style="font-family:var(--fd);font-weight:700;font-size:14.5px;color:var(--navy)">${c[1]}</div><div style="font-size:12.5px;color:var(--gray);margin-top:2px">${c[2]}</div></div></div>`).join("")}
  </div>
  ${footer("Buenas prácticas")}
</div></div>`);

/* 11 · Frases */
slides.push(`<div class="slide bg-dark"><div class="pad" style="justify-content:center">
  ${ic('quote','blue',30)}
  <h1 class="title anim" style="font-size:36px;margin-top:22px;max-width:38ch;line-height:1.3">Prompting no es escribir más largo.</h1>
  <h1 class="title anim" style="font-size:36px;margin-top:6px;max-width:38ch;line-height:1.3"><span style="color:var(--blue-l)">Es darle dirección a la IA.</span></h1>
  <p class="lead anim" style="font-size:17px;margin-top:22px;max-width:56ch">La primera respuesta es un borrador. El valor aparece en la iteración. Y Claude también sirve para <b style="color:#fff">cuestionarte</b>, no solo para obedecerte.</p>

const stage=document.getElementById('stage');stage.innerHTML=slides.join("");
const els=[...stage.querySelectorAll('.slide')];document.getElementById('total').textContent=els.length;let idx=0;
function show(n){n=Math.max(0,Math.min(els.length-1,n));els.forEach((s,i)=>s.classList.toggle('active',i===n));idx=n;document.getElementById('cur').textContent=n+1;document.getElementById('progress').style.width=((n+1)/els.length*100)+'%';els[n].querySelectorAll('.anim').forEach((el,k)=>el.style.transitionDelay=(0.04+k*0.05)+'s');if(window.lucide)lucide.createIcons()}
document.getElementById('next').onclick=()=>show(idx+1);document.getElementById('prev').onclick=()=>show(idx-1);
document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();show(idx+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(idx-1)}else if(e.key==='Home')show(0);else if(e.key==='End')show(els.length-1);else if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()}});
stage.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.5)show(idx+1);else show(idx-1)});
function fit(){document.getElementById('deck').style.transform=`scale(${Math.min(window.innerWidth/1280,window.innerHeight/720)})`}
window.addEventListener('resize',fit);fit();if(window.lucide)lucide.createIcons();show(0);
</script></body></html>
