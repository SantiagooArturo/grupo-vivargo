<!doctype html>
<html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>FullDay P5 — Claude Cowork + archivos · MyWorkIn × Grupo Vivargo</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--navy:#003C78;--blue:#0090C0;--blue-l:#57B6DD;--tint:#EAF3FA;--ink:#132a47;--gray:#5B6B7B;--line:#dbe6ef;--amber:#F2A23C;--shadow:0 18px 40px -18px rgba(2,30,60,.45);--shadow-sm:0 8px 22px -12px rgba(2,30,60,.35);--fd:'Sora',sans-serif;--fb:'Inter',sans-serif;--fc:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05101f;font-family:var(--fb);-webkit-font-smoothing:antialiased;overflow:hidden}
.viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#0a1f3a,#05101f 75%)}
.deck{position:relative;transform-origin:center center}
.stage{position:relative;width:1280px;height:720px;border-radius:18px;overflow:hidden;box-shadow:0 40px 120px -30px rgba(0,0,0,.8)}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .55s ease,transform .55s ease;transform:scale(1.02);overflow:hidden}
.slide.active{opacity:1;visibility:visible;transform:scale(1)}
.pad{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column}
.bg-light{background:radial-gradient(1200px 500px at 88% -10%,rgba(0,144,192,.10),transparent 60%),linear-gradient(180deg,#fff,#f3f8fc)}
.bg-tint{background:radial-gradient(900px 500px at 90% 110%,rgba(0,144,192,.10),transparent 60%),linear-gradient(180deg,#f6fafd,#eef5fb)}
.bg-dark{background:radial-gradient(900px 600px at 82% 8%,rgba(87,182,221,.30),transparent 55%),radial-gradient(700px 500px at 10% 100%,rgba(0,144,192,.22),transparent 60%),linear-gradient(135deg,#01244a,#003C78 58%,#0a5390)}
.bg-dark2{background:radial-gradient(800px 600px at 85% 12%,rgba(87,182,221,.22),transparent 55%),linear-gradient(150deg,#01182f,#012a52 70%)}
.kicker{font-family:var(--fb);font-weight:700;font-size:14px;letter-spacing:3px;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:10px}
.bg-dark .kicker,.bg-dark2 .kicker{color:var(--blue-l)}
.kicker .bar{width:34px;height:3px;border-radius:3px;background:currentColor}
h1.title{font-family:var(--fd);font-weight:800;color:var(--navy);font-size:42px;line-height:1.08;letter-spacing:-.5px;margin-top:14px}
.bg-dark h1.title,.bg-dark2 h1.title{color:#fff}
.lead{font-size:18px;color:var(--gray);margin-top:12px;max-width:62ch;line-height:1.5}
.bg-dark .lead,.bg-dark2 .lead{color:#bcd6ec}
.logo{height:40px}.logo.white{filter:brightness(0) invert(1)}
.brandmark{position:absolute;right:60px;bottom:34px;height:30px;opacity:.95}.brandmark.cobrand{display:flex;align-items:center;gap:14px}.brandmark.cobrand img{height:26px;width:auto}.cb-sep{width:1px;height:22px;background:rgba(255,255,255,.35)}.logo-plate{align-items:center;gap:18px;align-self:flex-start}.logo-plate .vv{filter:brightness(0)}.logo-plate .cb-sep{background:#d5dbe2;height:34px}
.footer{position:absolute;left:72px;right:72px;bottom:26px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--gray);border-top:1px solid var(--line);padding-top:10px}
.footer .sec{color:var(--blue);font-weight:700}
.bg-dark .footer,.bg-dark2 .footer{border-color:rgba(255,255,255,.14);color:#9fc0dc}.bg-dark .footer .sec,.bg-dark2 .footer .sec{color:var(--blue-l)}
.grid{display:grid;gap:18px}
.ic{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none}.ic svg{stroke-width:2.1}
.ic.navy{background:var(--navy);color:#fff}.ic.blue{background:linear-gradient(135deg,var(--blue),var(--blue-l));color:#fff}.ic.amber{background:linear-gradient(135deg,var(--amber),#f6bd78);color:#fff}.ic.soft{background:var(--tint);color:var(--navy)}
.codeblock{background:#0b1a30;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:20px 22px;font-family:var(--fc);font-size:13.5px;color:#e6f2fb;line-height:1.55;box-shadow:var(--shadow)}
.codeblock .k{color:var(--blue-l);font-weight:600}.codeblock .c{color:#93a7bd;font-style:italic}.codeblock .h{background:rgba(87,182,221,.14);padding:2px 6px;border-radius:5px}
.codehead{display:flex;align-items:center;gap:8px;font-size:11px;color:#7fa1c0;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;font-family:var(--fb);font-weight:700}
.codehead .dot{width:9px;height:9px;border-radius:50%}.codehead .dot.r{background:#ff5f56}.codehead .dot.y{background:#ffbd2e}.codehead .dot.g{background:#27c93f}
.slide .anim{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.3,1),transform .6s cubic-bezier(.2,.7,.3,1)}
.slide.active .anim{opacity:1;transform:none}
.ctl{position:fixed;z-index:50;display:flex;align-items:center;gap:14px;bottom:22px;left:50%;transform:translateX(-50%);background:rgba(6,18,34,.66);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);padding:8px 14px;border-radius:999px;color:#cfe0ee;font-size:13px;font-weight:600}
.ctl button{all:unset;cursor:pointer;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#dbe9f6}.ctl button:hover{background:rgba(255,255,255,.12)}
.progress{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--blue),var(--blue-l));z-index:60;transition:width .4s ease}
.hint{position:fixed;top:14px;right:16px;z-index:50;color:#7f9bb5;font-size:12px}
.imgwrap{border-radius:16px;overflow:hidden;box-shadow:var(--shadow);background:#fff}
.imgwrap img{width:100%;height:100%;object-fit:contain;display:block}
.codehead .cp{margin-left:auto;font-family:var(--fb);font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:none;color:#d6ebf8;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:4px 12px;cursor:pointer;transition:background .2s ease}.codehead .cp:hover{background:#0090C0;border-color:#0090C0;color:#fff}.codehead .cp.ok{background:#1F8A5B;border-color:#1F8A5B;color:#fff}
</style></head>
<body>
<div class="progress" id="progress"></div><div class="hint">← → · F pantalla completa</div>
<div class="viewport"><div class="deck" id="deck"><div class="stage" id="stage"></div></div></div>
<div class="ctl"><button id="prev"><i data-lucide="chevron-left"></i></button><span><span id="cur">1</span> / <span id="total">1</span></span><button id="next"><i data-lucide="chevron-right"></i></button></div>
<script>
const LOGO="logo_myworkin.png";const LOGO_VV="media/logo_vivargo.svg";const SEC="FullDay · Claude e IA para el trabajo · Grupo Vivargo";
function ic(n,c,s=22){return `<span class="ic ${c}" style="width:${s+22}px;height:${s+22}px"><i data-lucide="${n}" style="width:${s}px;height:${s}px"></i></span>`}
function footer(t){return `<div class="footer anim"><span>${SEC}</span><span class="sec">${t}</span></div>`}
function titlebar(k,t){return `<div class="titlebar anim"><div class="kicker"><span class="bar"></span>${k}</div><h1 class="title">${t}</h1></div>`}
function brand(){return `<span class="brandmark cobrand"><img src="${LOGO}" class="logo white" alt="MyWorkIn"><span class="cb-sep"></span><img src="${LOGO_VV}" class="logo vv" alt="Grupo Vivargo"></span>`}
function code(h,b){return `<div class="codeblock anim"><div class="codehead"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span>${h}</span></div>${b}</div>`}
const slides=[];

/* 1 · Cover — reutiliza agente_diagrama.png (idea: Claude actúa como agente sobre archivos) */
slides.push(`<div class="slide bg-dark"><div class="pad">
  <div class="kicker anim"><span class="bar"></span>FullDay · Bloque 5</div>
  <h1 class="title anim" style="font-size:70px;margin-top:14px;max-width:22ch">Claude Cowork + archivos</h1>
  <p class="lead anim" style="font-size:22px;margin-top:16px">Claude ya no solo responde — <b style="color:var(--blue-l)">trabaja sobre tus materiales reales</b>: documentos, PDFs, Excels y navegador.</p>
  <div class="anim" style="margin-top:20px;color:#9fc4de;font-size:14px">45 minutos</div>
  ${brand()}
</div></div>`);

/* 2 · Cowork: qué es (con agente_diagrama.png) */
slides.push(`<div class="slide bg-light"><div class="pad">
  ${titlebar("Cowork","Claude trabajando sobre materiales reales — como un agente con herramientas")}
  <div style="display:flex;gap:24px;margin-top:20px;flex:1;align-items:center">
    <div class="anim imgwrap" style="flex:1.1;height:420px;padding:12px"><img src="assets/agente_diagrama.png" alt="Agente Claude"></div>
    <div class="anim" style="flex:1;display:flex;flex-direction:column;gap:12px">
    ${[["folder-open","Lee carpetas","abre y organiza documentos"],["file-text","Analiza archivos","Word, PDF, Excel, CSV, imágenes"],["globe","Navega la web","valida datos, busca fuentes"],["file-plus","Genera entregables","resúmenes, tablas, correos, reportes"]].map(c=>`<div style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm)">${ic(c[0],'blue',14)}<div><div style="font-family:var(--fd);font-weight:700;font-size:14.5px;color:var(--navy)">${c[1]}</div><div style="font-size:12.5px;color:var(--gray);margin-top:2px">${c[2]}</div></div></div>`).join("")}
    </div>
  </div>
  ${footer("Bloque 5")}
</div></div>`);

/* 3 · Chat vs Cowork */
slides.push(`<div class="slide bg-tint"><div class="pad">
  ${titlebar("Cuándo usar Chat — cuándo usar Cowork","Distinguir es clave para elegir bien")}
  <div style="display:flex;gap:24px;margin-top:22px;flex:1;align-items:stretch">
    <div class="anim" style="flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;gap:12px">${ic('message-square','soft',18)}<span style="font-family:var(--fd);font-weight:800;font-size:22px;color:var(--navy)">Claude Chat</span></div>
      <p style="color:var(--gray);font-size:14.5px;margin-top:12px;line-height:1.55">Para <b style="color:var(--navy)">pensar</b>, redactar, decidir, estructurar ideas o hacer análisis sobre lo que ya está en tu cabeza.</p>
      <div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray)">Ejemplos</div>
      <div style="display:flex;flex-direction:column;gap:9px;margin-top:12px">
      ${[
        ["pencil-line","Responder el correo de un cliente que pide una grúa"],
        ["scale","Ordenar pros y contras de dos cronogramas de parada"],
        ["lightbulb","Ideas para el stand de una feria minera"],
        ["list-checks","Estructurar la agenda de una visita técnica"]
      ].map(c=>`<div style="display:flex;align-items:center;gap:10px"><i data-lucide="${c[0]}" style="width:15px;height:15px;color:var(--blue);flex:none"></i><span style="font-size:13.5px;color:var(--ink)">${c[1]}</span></div>`).join("")}
      </div>
    </div>
    <div class="anim" style="flex:1.1;background:linear-gradient(160deg,var(--navy),#0a5390);border-radius:16px;padding:26px;color:#fff;box-shadow:var(--shadow-sm);display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;gap:12px">${ic('files','blue',18)}<span style="font-family:var(--fd);font-weight:800;font-size:22px">Claude Cowork</span></div>
      <p style="color:#d6ebf8;font-size:14.5px;margin-top:12px;line-height:1.55">Para <b style="color:var(--blue-l)">trabajar sobre archivos</b> — carpetas, PDFs, Excels, facturas, fichas técnicas, webs.</p>
      <div style="margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.18);font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#9fc4de">Ejemplos</div>
      <div style="display:flex;flex-direction:column;gap:9px;margin-top:12px">
      ${[
        ["folder-tree","Ordenar 80 facturas de proveedores en carpetas"],
        ["files","Revisar 10 propuestas contra el tarifario"],
        ["file-text","Resumir las bases de una licitación minera de 40 páginas"],
        ["globe","Comparar fichas técnicas JLG en la web del fabricante"]
      ].map(c=>`<div style="display:flex;align-items:center;gap:10px"><i data-lucide="${c[0]}" style="width:15px;height:15px;color:var(--blue-l);flex:none"></i><span style="font-size:13.5px;color:#e6f2fb">${c[1]}</span></div>`).join("")}
      </div>
    </div>
  </div>
  <div class="anim" style="margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 22px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm)">
    ${ic('sparkles','amber',15)}
    <span style="font-family:var(--fd);font-weight:700;font-size:15px;color:var(--navy)">Regla rápida: si el trabajo empieza abriendo un archivo — probablemente es Cowork.</span>
  </div>
  ${footer("Bloque 5")}
</div></div>`);

/* 4 · Qué puede hacer Cowork */
slides.push(`<div class="slide bg-light"><div class="pad">
  ${titlebar("Qué tipo de trabajos puede hacer","El día a día de un profesional AI-first que usa Cowork")}
  <div class="grid anim" style="grid-template-columns:repeat(4,1fr);margin-top:24px;gap:14px;flex:1;align-items:stretch">
  ${[
    ["folder-search","Analizar una carpeta","de facturas, propuestas o contratos"],
    ["users","Comparar propuestas","contra tarifario y condiciones"],
    ["table","Leer Excels","horómetros, inventarios, pedidos"],
    ["file-check","Revisar documentos","propuestas, contratos, minutas"],
    ["search","Investigar sitios","competencia, fichas técnicas"],
    ["file-audio","Transcribir audio","reuniones, visitas técnicas"],
    ["mail","Preparar correos","a clientes, a partir de contexto"],
    ["file-bar-chart","Armar reportes","gasto por proveedor y resúmenes"]
  ].map(c=>`<div style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;box-shadow:var(--shadow-sm)">${ic(c[0],'blue',14)}<div style="font-family:var(--fd);font-weight:700;font-size:13.5px;color:var(--navy);margin-top:10px">${c[1]}</div><div style="font-size:11.5px;color:var(--gray);margin-top:4px">${c[2]}</div></div>`).join("")}
  </div>
  ${footer("Casos")}
</div></div>`);

/* 5 · Demo carpeta de facturas de proveedores */
slides.push(`<div class="slide bg-light"><div class="pad">
  ${titlebar("Demo · ordenar las facturas de proveedores","80 facturas sueltas → carpetas ordenadas + resumen de gasto")}
  <div style="margin-top:14px;flex:1;display:flex;align-items:center;gap:22px">
    ${code("Prompt · carpeta cowork/Facturas_Proveedores_Sin_Ordenar",`<span style="white-space:pre-wrap">En esta carpeta hay <span class="k h">80 facturas de proveedores</span>
de julio a setiembre, con nombres desordenados.

1. Lee cada PDF: proveedor, serie-número, fecha,
   moneda, total y a qué equipo corresponde.
2. <span class="k">Ordénalas en carpetas</span> por categoría de gasto
   y dentro por mes <span class="c">(Repuestos/08-agosto/…)</span>.
3. <span class="k">Renómbralas</span> como <span class="c">AAAA-MM-DD_Proveedor_Serie-Número.pdf</span>
4. Crea un <span class="k">Excel resumen</span>: una fila por factura y
   totales por categoría y mes, en soles y en dólares.

Lo que no sea una factura válida para Vivargo
<span class="c">(duplicados, cotizaciones, facturas a otro RUC)</span>
va a una carpeta <span class="k">_Revisar</span> con el motivo. No la sumes.</span>`)}
    <div class="anim" style="flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow-sm)"><div style="font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray)">En la carpeta · datos ficticios</div><div style="display:flex;flex-direction:column;gap:10px;margin-top:12px"><div style="display:flex;align-items:flex-start;gap:10px"><i data-lucide="files" style="width:15px;height:15px;color:var(--blue);flex:none;margin-top:2px"></i><span style="font-size:13px;color:var(--ink);line-height:1.45">80 PDFs con nombres como «scan_0788», «doc (22)» o «IMG_20260804_factura»</span></div><div style="display:flex;align-items:flex-start;gap:10px"><i data-lucide="building-2" style="width:15px;height:15px;color:var(--blue);flex:none;margin-top:2px"></i><span style="font-size:13px;color:var(--ink);line-height:1.45">11 proveedores: repuestos, combustible, llantas, mantenimiento, transporte, EPP y más</span></div><div style="display:flex;align-items:flex-start;gap:10px"><i data-lucide="coins" style="width:15px;height:15px;color:var(--blue);flex:none;margin-top:2px"></i><span style="font-size:13px;color:var(--ink);line-height:1.45">En soles y en dólares</span></div></div><div style="font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);margin-top:18px;padding-top:16px;border-top:1px solid var(--line)">Qué revisar en el resultado</div><div style="display:flex;flex-direction:column;gap:10px;margin-top:12px"><div style="display:flex;align-items:flex-start;gap:10px"><i data-lucide="copy" style="width:15px;height:15px;color:var(--blue);flex:none;margin-top:2px"></i><span style="font-size:13px;color:var(--ink);line-height:1.45">¿Encontró las 2 facturas duplicadas?</span></div><div style="display:flex;align-items:flex-start;gap:10px"><i data-lucide="file-x" style="width:15px;height:15px;color:var(--blue);flex:none;margin-top:2px"></i><span style="font-size:13px;color:var(--ink);line-height:1.45">¿Separó la cotización y la factura emitida a otro RUC?</span></div><div style="display:flex;align-items:flex-start;gap:10px"><i data-lucide="minus-circle" style="width:15px;height:15px;color:var(--blue);flex:none;margin-top:2px"></i><span style="font-size:13px;color:var(--ink);line-height:1.45">¿Restó la nota de crédito en vez de sumarla?</span></div></div></div>
  </div>
  ${footer("Demo · Facturas")}
</div></div>`);

/* 6 · Demo benchmark de la competencia */
slides.push(`<div class="slide bg-tint"><div class="pad">
  ${titlebar("Demo alternativa · benchmark de la competencia","Cowork navega la web y cita cada fuente")}
  <div style="margin-top:14px;flex:1;display:flex;align-items:center;gap:22px">
    ${code("Prompt · benchmark de competencia",`<span style="white-space:pre-wrap">Arma un <span class="k h">benchmark de la competencia</span> de Grupo Vivargo:

<span class="c">A. Empresas que alquilan grúas y equipos de izaje en Perú</span>
<span class="c">B. Marcas que compiten con JLG en plataformas y telehandlers</span>

<span class="k">Búscalas tú</span> y elige las 5 más relevantes de cada frente.
Revisa sus webs públicas con el navegador, paso a paso.

Devuélveme un <span class="k">Excel comparativo</span>:
1. Empresa o marca · sedes · tipos de equipo · capacidades
2. Servicios que ofrecen <span class="c">(operador, plan de izaje, etc.)</span>
3. Qué comunican como diferencial
4. Dónde Vivargo tiene ventaja y dónde tiene brechas
5. <span class="k">Fuente</span>: URL y fecha de consulta en cada fila

<span class="k">Si un dato no está publicado</span>, márcalo como
"no publicado" &mdash; no inventes cifras ni nombres.</span>`)}

/* Botón «Copiar» en cada bloque de prompt: copia el texto sin la cabecera. */
(function(){
  function copiar(txt,btn){
    var ok=function(){btn.textContent='Copiado ✓';btn.classList.add('ok');
      setTimeout(function(){btn.textContent='Copiar';btn.classList.remove('ok')},1800)};
    var legacy=function(){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';
      ta.style.opacity='0';document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');ok()}finally{ta.remove()}};
    if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(ok,legacy);else legacy();
  }
  document.querySelectorAll('.codeblock').forEach(function(cb){
    var head=cb.querySelector('.codehead');
    if(!head||head.querySelector('.cp'))return;
    var b=document.createElement('button');b.type='button';b.className='cp';b.textContent='Copiar';
    b.addEventListener('click',function(e){
      e.stopPropagation();
      head.style.display='none';var txt=cb.innerText.trim();head.style.display='';
      copiar(txt,b);
    });
    head.appendChild(b);
  });
})();
</script>
