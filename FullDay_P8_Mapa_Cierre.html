<!doctype html>
<html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>FullDay P8 — Mapa final + cierre aplicado · MyWorkIn × Grupo Vivargo</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--navy:#003C78;--blue:#0090C0;--blue-l:#57B6DD;--tint:#EAF3FA;--ink:#132a47;--gray:#5B6B7B;--line:#dbe6ef;--amber:#F2A23C;--shadow:0 18px 40px -18px rgba(2,30,60,.45);--shadow-sm:0 8px 22px -12px rgba(2,30,60,.35);--fd:'Sora',sans-serif;--fb:'Inter',sans-serif;--fc:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05101f;font-family:var(--fb);-webkit-font-smoothing:antialiased;overflow:hidden}
.viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#0a1f3a,#05101f 75%)}
.deck{position:relative;transform-origin:center center}
.stage{position:relative;width:1280px;height:720px;border-radius:18px;overflow:hidden;box-shadow:0 40px 120px -30px rgba(0,0,0,.8)}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .55s ease,transform .55s ease;transform:scale(1.02);overflow:hidden}
.slide.active{opacity:1;visibility:visible;transform:scale(1)}
.pad{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column}
.bg-light{background:radial-gradient(1200px 500px at 88% -10%,rgba(0,144,192,.10),transparent 60%),linear-gradient(180deg,#fff,#f3f8fc)}
.bg-tint{background:radial-gradient(900px 500px at 90% 110%,rgba(0,144,192,.10),transparent 60%),linear-gradient(180deg,#f6fafd,#eef5fb)}
.bg-dark{background:radial-gradient(900px 600px at 82% 8%,rgba(87,182,221,.30),transparent 55%),radial-gradient(700px 500px at 10% 100%,rgba(0,144,192,.22),transparent 60%),linear-gradient(135deg,#01244a,#003C78 58%,#0a5390)}
.bg-dark2{background:radial-gradient(800px 600px at 85% 12%,rgba(87,182,221,.22),transparent 55%),linear-gradient(150deg,#01182f,#012a52 70%)}
.bg-black{background:radial-gradient(900px 600px at 80% 15%,rgba(0,144,192,.25),transparent 55%),radial-gradient(700px 500px at 15% 95%,rgba(87,182,221,.18),transparent 60%),linear-gradient(160deg,#020a18,#06182d)}
.kicker{font-family:var(--fb);font-weight:700;font-size:14px;letter-spacing:3px;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:10px}
.bg-dark .kicker,.bg-dark2 .kicker,.bg-black .kicker{color:var(--blue-l)}
.kicker .bar{width:34px;height:3px;border-radius:3px;background:currentColor}
h1.title{font-family:var(--fd);font-weight:800;color:var(--navy);font-size:42px;line-height:1.08;letter-spacing:-.5px;margin-top:14px}
.bg-dark h1.title,.bg-dark2 h1.title,.bg-black h1.title{color:#fff}
.lead{font-size:18px;color:var(--gray);margin-top:12px;max-width:62ch;line-height:1.5}
.bg-dark .lead,.bg-dark2 .lead,.bg-black .lead{color:#bcd6ec}
.logo{height:40px}.logo.white{filter:brightness(0) invert(1)}
.brandmark{position:absolute;right:60px;bottom:34px;height:30px;opacity:.95}.brandmark.cobrand{display:flex;align-items:center;gap:14px}.brandmark.cobrand img{height:26px;width:auto}.cb-sep{width:1px;height:22px;background:rgba(255,255,255,.35)}.logo-plate{align-items:center;gap:18px;align-self:flex-start}.logo-plate .vv{filter:brightness(0)}.logo-plate .cb-sep{background:#d5dbe2;height:34px}
.footer{position:absolute;left:72px;right:72px;bottom:26px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--gray);border-top:1px solid var(--line);padding-top:10px}
.footer .sec{color:var(--blue);font-weight:700}
.bg-dark .footer,.bg-dark2 .footer,.bg-black .footer{border-color:rgba(255,255,255,.14);color:#9fc0dc}.bg-dark .footer .sec,.bg-dark2 .footer .sec,.bg-black .footer .sec{color:var(--blue-l)}
.grid{display:grid;gap:18px}
.ic{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none}.ic svg{stroke-width:2.1}
.ic.navy{background:var(--navy);color:#fff}.ic.blue{background:linear-gradient(135deg,var(--blue),var(--blue-l));color:#fff}.ic.amber{background:linear-gradient(135deg,var(--amber),#f6bd78);color:#fff}.ic.soft{background:var(--tint);color:var(--navy)}
.slide .anim{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.3,1),transform .6s cubic-bezier(.2,.7,.3,1)}
.slide.active .anim{opacity:1;transform:none}
.ctl{position:fixed;z-index:50;display:flex;align-items:center;gap:14px;bottom:22px;left:50%;transform:translateX(-50%);background:rgba(6,18,34,.66);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);padding:8px 14px;border-radius:999px;color:#cfe0ee;font-size:13px;font-weight:600}
.ctl button{all:unset;cursor:pointer;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#dbe9f6}.ctl button:hover{background:rgba(255,255,255,.12)}
.progress{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--blue),var(--blue-l));z-index:60;transition:width .4s ease}
.hint{position:fixed;top:14px;right:16px;z-index:50;color:#7f9bb5;font-size:12px}
.matrix{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;flex:1;position:relative}
.quad{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;position:relative}
.center-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,var(--navy),#0a5390);border-radius:16px;padding:14px 18px;color:#fff;text-align:center;min-width:220px;box-shadow:0 20px 40px -12px rgba(0,0,0,.4);z-index:2;border:3px solid #fff}
</style></head>
<body>
<div class="progress" id="progress"></div><div class="hint">← → · F pantalla completa</div>
<div class="viewport"><div class="deck" id="deck"><div class="stage" id="stage"></div></div></div>
<div class="ctl"><button id="prev"><i data-lucide="chevron-left"></i></button><span><span id="cur">1</span> / <span id="total">1</span></span><button id="next"><i data-lucide="chevron-right"></i></button></div>
<script>
const LOGO="logo_myworkin.png";const LOGO_VV="media/logo_vivargo.svg";const SEC="FullDay · Claude e IA para el trabajo · Grupo Vivargo";
function ic(n,c,s=22){return `<span class="ic ${c}" style="width:${s+22}px;height:${s+22}px"><i data-lucide="${n}" style="width:${s}px;height:${s}px"></i></span>`}
function footer(t){return `<div class="footer anim"><span>${SEC}</span><span class="sec">${t}</span></div>`}
function titlebar(k,t){return `<div class="titlebar anim"><div class="kicker"><span class="bar"></span>${k}</div><h1 class="title">${t}</h1></div>`}
function brand(){return `<span class="brandmark cobrand"><img src="${LOGO}" class="logo white" alt="MyWorkIn"><span class="cb-sep"></span><img src="${LOGO_VV}" class="logo vv" alt="Grupo Vivargo"></span>`}
const slides=[];

/* 1 · Cover */
slides.push(`<div class="slide bg-dark"><div class="pad">
  <div class="kicker anim"><span class="bar"></span>FullDay · Bloque 8 · Cierre</div>
  <h1 class="title anim" style="font-size:70px;margin-top:14px;max-width:22ch">Mapa final + cierre aplicado</h1>
  <p class="lead anim" style="font-size:22px;margin-top:16px">Todo lo que vimos hoy — integrado en un mapa que te llevas.</p>
  <div class="anim" style="margin-top:20px;color:#9fc4de;font-size:14px">25 minutos</div>
  ${brand()}
</div></div>`);

/* 2 · Mapa de uso de Claude (matriz 2x2) */
slides.push(`<div class="slide bg-light"><div class="pad">
  ${titlebar("Mapa de uso de Claude","Cuatro superficies · cuatro tipos de trabajo")}
  <div class="matrix anim" style="margin-top:16px">
    <div class="quad">
      <div style="display:flex;align-items:center;gap:12px">${ic('message-square','blue',16)}<span style="font-family:var(--fd);font-weight:800;font-size:20px;color:var(--navy)">Claude Chat</span></div>
      <p style="font-size:13.5px;color:var(--gray);margin-top:8px;line-height:1.5">Pensar, redactar, analizar, estructurar.</p>
      <div style="margin-top:auto;display:flex;align-items:flex-start;gap:8px;background:var(--tint);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--ink);line-height:1.4"><i data-lucide="hard-hat" style="width:14px;height:14px;color:var(--blue);flex:none;margin-top:2px"></i><span><b style="color:var(--navy)">En Vivargo:</b> el correo que acompaña la propuesta de alquiler a una minera.</span></div>
    </div>
    <div class="quad">
      <div style="display:flex;align-items:center;gap:12px">${ic('files','blue',16)}<span style="font-family:var(--fd);font-weight:800;font-size:20px;color:var(--navy)">Claude Cowork</span></div>
      <p style="font-size:13.5px;color:var(--gray);margin-top:8px;line-height:1.5">Trabajar sobre archivos, carpetas, documentos y navegador.</p>
      <div style="margin-top:auto;display:flex;align-items:flex-start;gap:8px;background:var(--tint);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--ink);line-height:1.4"><i data-lucide="hard-hat" style="width:14px;height:14px;color:var(--blue);flex:none;margin-top:2px"></i><span><b style="color:var(--navy)">En Vivargo:</b> ordenar 80 facturas de proveedores en carpetas, o conciliar el inventario de un almacén.</span></div>
    </div>
    <div class="quad" style="padding-top:92px">
      <div style="display:flex;align-items:center;gap:12px">${ic('palette','blue',16)}<span style="font-family:var(--fd);font-weight:800;font-size:20px;color:var(--navy)">Claude Design</span></div>
      <p style="font-size:13.5px;color:var(--gray);margin-top:8px;line-height:1.5">Crear entregables visuales.</p>
      <div style="margin-top:auto;display:flex;align-items:flex-start;gap:8px;background:var(--tint);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--ink);line-height:1.4"><i data-lucide="hard-hat" style="width:14px;height:14px;color:var(--blue);flex:none;margin-top:2px"></i><span><b style="color:var(--navy)">En Vivargo:</b> la ficha comercial de un equipo JLG para el equipo de ventas.</span></div>
    </div>
    <div class="quad" style="padding-top:92px">
      <div style="display:flex;align-items:center;gap:12px">${ic('code-2','blue',16)}<span style="font-family:var(--fd);font-weight:800;font-size:20px;color:var(--navy)">Claude Code</span></div>
      <p style="font-size:13.5px;color:var(--gray);margin-top:8px;line-height:1.5">Crear herramientas funcionales.</p>
      <div style="margin-top:auto;display:flex;align-items:flex-start;gap:8px;background:var(--tint);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--ink);line-height:1.4"><i data-lucide="hard-hat" style="width:14px;height:14px;color:var(--blue);flex:none;margin-top:2px"></i><span><b style="color:var(--navy)">En Vivargo:</b> un cotizador de alquiler con el tarifario vigente.</span></div>
    </div>
    <div class="center-badge anim">
      <div style="display:flex;align-items:center;justify-content:center;gap:10px"><i data-lucide="timer" style="width:16px;height:16px;color:var(--blue-l)"></i><span style="font-family:var(--fd);font-weight:800;font-size:14px">Schedule Tasks</span></div>
      <div style="font-size:11.5px;color:#bcd6ec;margin-top:6px;font-style:italic">Convierte trabajos repetibles en rutinas.</div>
      <div style="font-size:11px;color:#fff;margin-top:5px">Ej.: alerta semanal de mantenimiento preventivo</div>
    </div>
  </div>
  ${footer("Mapa de uso")}
</div></div>`);

/* 3 · Tres cimientos que atraviesan todo */
slides.push(`<div class="slide bg-tint"><div class="pad">
  ${titlebar("Los tres cimientos","Presentes en todo lo que vimos — no son una capa aparte")}
  <div class="grid anim" style="grid-template-columns:1fr 1fr 1fr;margin-top:26px;gap:16px;flex:1;align-items:stretch">
  ${[
    ["folder","Projects","Contexto persistente — qué debe SABER Claude"],
    ["brain","Skills","Método especializado — cómo debe PENSAR Claude"],
    ["database","Memoria","Continuidad — y personalización que se afina con el tiempo"]
  ].map(c=>`<div style="background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;box-shadow:var(--shadow-sm)">${ic(c[0],'blue',18)}<div style="font-family:var(--fd);font-weight:800;font-size:22px;color:var(--navy);margin-top:14px">${c[1]}</div><p style="font-size:13.5px;color:var(--gray);margin-top:8px;line-height:1.5">${c[2]}</p></div>`).join("")}
  </div>
  <p class="anim" style="text-align:center;font-family:var(--fd);font-style:italic;font-weight:700;color:var(--navy);font-size:14.5px;margin-top:16px">Chat, Cowork, Design, Code y Schedule Tasks — todos aprovechan estos tres.</p>
  ${footer("Cimientos")}
</div></div>`);

/* 4 · Cómo decidir qué usar (tabla) */
slides.push(`<div class="slide bg-light"><div class="pad">
  ${titlebar("Cómo decidir qué usar","Una tabla mental — con casos de Vivargo")}
  <div class="anim" style="margin-top:18px;flex:1;display:flex;align-items:center">
    <div style="width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow-sm)">
    ${[
      ["Necesito pensar, escribir o decidir","Claude Chat","message-square","Correo de propuesta de alquiler a una minera"],
      ["Necesito contexto permanente","Projects","folder","Project Comercial Alquiler: tarifario, condiciones, ingreso a mina"],
      ["Necesito un método o rol especializado","Skills","brain","cotizar-alquiler-equipo · revisar-riesgos-izaje"],
      ["Necesito revisar archivos o páginas","Cowork","files","Ordenar facturas de proveedores · inventario de un almacén"],
      ["Necesito crear algo visual","Design","palette","Ficha comercial de un equipo JLG"],
      ["Necesito construir una herramienta","Code","code-2","Cotizador de alquiler"],
      ["Necesito que ocurra cada cierto tiempo","Schedule Tasks","timer","Alerta semanal de mantenimiento preventivo"]
    ].map((r,i)=>`<div style="display:flex;align-items:center;gap:16px;padding:10px 4px;${i<6?'border-bottom:1px solid var(--line);':''}"><span style="flex:1;font-size:14.5px;color:var(--ink)">${r[0]}</span><span style="flex:1.15;font-size:12.5px;color:var(--gray);display:flex;align-items:center;gap:7px"><i data-lucide="hard-hat" style="width:13px;height:13px;color:var(--blue-l);flex:none"></i>${r[3]}</span><span style="display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:700;font-size:14.5px;color:var(--blue);min-width:200px;justify-content:flex-end"><i data-lucide="${r[2]}" style="width:16px;height:16px"></i>${r[1]}</span></div>`).join("")}
    </div>
  </div>
  ${footer("Tabla de decisión")}
</div></div>`);

/* 5 · Sistema completo */
slides.push(`<div class="slide bg-dark2"><div class="pad">
  ${titlebar("El sistema completo","Lo que armamos hoy — en una imagen")}
  <div class="anim" style="margin-top:16px;flex:1;display:flex;align-items:center;justify-content:center;gap:24px">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px 16px;color:#fff;display:flex;align-items:center;gap:10px"><i data-lucide="folder" style="width:15px;height:15px;color:var(--blue-l)"></i><span style="font-family:var(--fd);font-weight:700;font-size:13.5px">Projects</span></div>
      <div style="background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px 16px;color:#fff;display:flex;align-items:center;gap:10px"><i data-lucide="brain" style="width:15px;height:15px;color:var(--blue-l)"></i><span style="font-family:var(--fd);font-weight:700;font-size:13.5px">Skills</span></div>
      <div style="background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px 16px;color:#fff;display:flex;align-items:center;gap:10px"><i data-lucide="database" style="width:15px;height:15px;color:var(--blue-l)"></i><span style="font-family:var(--fd);font-weight:700;font-size:13.5px">Memoria</span></div>
    </div>
    <div style="align-self:center;color:var(--blue-l);font-size:26px">→</div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="background:linear-gradient(135deg,var(--blue),var(--blue-l));border-radius:12px;padding:12px 18px;color:#fff;display:flex;align-items:center;gap:10px"><i data-lucide="message-square" style="width:15px;height:15px"></i><span style="font-family:var(--fd);font-weight:700;font-size:13.5px">Chat</span></div>
      <div style="background:linear-gradient(135deg,var(--blue),var(--blue-l));border-radius:12px;padding:12px 18px;color:#fff;display:flex;align-items:center;gap:10px"><i data-lucide="files" style="width:15px;height:15px"></i><span style="font-family:var(--fd);font-weight:700;font-size:13.5px">Cowork</span></div>
      <div style="background:linear-gradient(135deg,var(--blue),var(--blue-l));border-radius:12px;padding:12px 18px;color:#fff;display:flex;align-items:center;gap:10px"><i data-lucide="palette" style="width:15px;height:15px"></i><span style="font-family:var(--fd);font-weight:700;font-size:13.5px">Design</span></div>
      <div style="background:linear-gradient(135deg,var(--blue),var(--blue-l));border-radius:12px;padding:12px 18px;color:#fff;display:flex;align-items:center;gap:10px"><i data-lucide="code-2" style="width:15px;height:15px"></i><span style="font-family:var(--fd);font-weight:700;font-size:13.5px">Code</span></div>
    </div>
    <div style="align-self:center;color:var(--blue-l);font-size:26px">→</div>
    <div style="display:flex;flex-direction:column;gap:12px;align-items:center">
      <div style="background:linear-gradient(135deg,var(--amber),#f6bd78);border-radius:12px;padding:14px 20px;color:#fff;display:flex;align-items:center;gap:10px"><i data-lucide="timer" style="width:16px;height:16px"></i><span style="font-family:var(--fd);font-weight:800;font-size:14px">Schedule Tasks</span></div>
      <div style="font-family:var(--fd);font-style:italic;font-weight:700;color:#d6ebf8;font-size:12px;max-width:160px;text-align:center">Los convierte en rutinas recurrentes</div>
    </div>
  </div>
  ${footer("Sistema")}
</div></div>`);

/* 6 · Qué se lleva el participante */
slides.push(`<div class="slide bg-light"><div class="pad">
  ${titlebar("Qué te llevas","Lo que sales sabiendo hacer — y lo que te llevas listo")}
  <div class="grid anim" style="grid-template-columns:1fr 1fr;margin-top:22px;gap:14px;flex:1;align-items:stretch">
  ${[
    ["pen-tool","Escribir prompts profesionales","con los 7 ingredientes — no vagos"],
    ["folder-cog","El Project Comercial Alquiler + 2 Skills","cotizar-alquiler-equipo y revisar-riesgos-izaje, listos para usar"],
    ["files","Delegar trabajo con archivos","facturas, inventarios, planes de izaje"],
    ["palette","Crear entregables visuales y herramientas","fichas de equipo y un cotizador, sin ser dev"],
    ["timer","Diseñar rutinas AI-first","que trabajen mientras tú haces otra cosa"],
    ["compass","Elegir qué superficie usar","según la tarea"]
  ].map(c=>`<div style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-sm);min-width:0">${ic(c[0],'blue',14)}<div><div style="font-family:var(--fd);font-weight:700;font-size:14.5px;color:var(--navy)">${c[1]}</div><div style="font-size:12.5px;color:var(--gray);margin-top:2px">${c[2]}</div></div></div>`).join("")}
  </div>
  ${footer("Te llevas")}
</div></div>`);

/* 7 · Mensaje final */
slides.push(`<div class="slide bg-dark"><div class="pad" style="justify-content:center">
  <div class="kicker anim"><span class="bar"></span>Mensaje final</div>
  <h1 class="title anim" style="font-size:44px;margin-top:14px;max-width:34ch;line-height:1.2">La meta no es usar Claude <span style="color:var(--gray)">más veces al día.</span></h1>
  <h1 class="title anim" style="font-size:44px;margin-top:10px;max-width:36ch;line-height:1.2">La meta es diseñar un sistema donde Claude <span style="color:var(--blue-l)">piense, revise, prepare, cree y te ayude a decidir mejor.</span></h1>
  <p class="lead anim" style="font-size:18px;margin-top:22px;max-width:62ch">Con una regla que en Vivargo no cambia: la IA prepara y revisa; en <b style="color:#fff">seguridad</b> y en cada izaje, deciden las personas.</p>
  ${brand()}
</div></div>`);

/* 8 · Frase de cierre */
slides.push(`<div class="slide bg-black"><div class="pad" style="justify-content:center">
  ${ic('sparkles','blue',34)}
  <h1 class="title anim" style="font-size:64px;margin-top:22px;max-width:22ch;line-height:1.05">El profesional AI-first no solo hace prompts.</h1>
  <h1 class="title anim" style="font-size:64px;margin-top:12px;max-width:22ch;line-height:1.05"><span style="color:var(--blue-l)">Diseña sistemas de trabajo.</span></h1>
  <p class="lead anim" style="font-size:19px;margin-top:26px;max-width:60ch;color:#9fc4de">Gracias por estas 4 horas. Ahora — a construir.</p>
  ${brand()}
</div></div>`);

const stage=document.getElementById('stage');stage.innerHTML=slides.join("");
const els=[...stage.querySelectorAll('.slide')];document.getElementById('total').textContent=els.length;let idx=0;
function show(n){n=Math.max(0,Math.min(els.length-1,n));els.forEach((s,i)=>s.classList.toggle('active',i===n));idx=n;document.getElementById('cur').textContent=n+1;document.getElementById('progress').style.width=((n+1)/els.length*100)+'%';els[n].querySelectorAll('.anim').forEach((el,k)=>el.style.transitionDelay=(0.04+k*0.05)+'s');if(window.lucide)lucide.createIcons()}
document.getElementById('next').onclick=()=>show(idx+1);document.getElementById('prev').onclick=()=>show(idx-1);
document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();show(idx+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(idx-1)}else if(e.key==='Home')show(0);else if(e.key==='End')show(els.length-1);else if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()}});
stage.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.5)show(idx+1);else show(idx-1)});
function fit(){document.getElementById('deck').style.transform=`scale(${Math.min(window.innerWidth/1280,window.innerHeight/720)})`}
window.addEventListener('resize',fit);fit();if(window.lucide)lucide.createIcons();show(0);
</script></body></html>
