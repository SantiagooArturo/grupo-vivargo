<!doctype html>
<html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>FullDay P7 — Schedule Tasks + workflows AI-first · MyWorkIn × Grupo Vivargo</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--navy:#003C78;--blue:#0090C0;--blue-l:#57B6DD;--tint:#EAF3FA;--ink:#132a47;--gray:#5B6B7B;--line:#dbe6ef;--amber:#F2A23C;--shadow:0 18px 40px -18px rgba(2,30,60,.45);--shadow-sm:0 8px 22px -12px rgba(2,30,60,.35);--fd:'Sora',sans-serif;--fb:'Inter',sans-serif;--fc:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05101f;font-family:var(--fb);-webkit-font-smoothing:antialiased;overflow:hidden}
.viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#0a1f3a,#05101f 75%)}
.deck{position:relative;transform-origin:center center}
.stage{position:relative;width:1280px;height:720px;border-radius:18px;overflow:hidden;box-shadow:0 40px 120px -30px rgba(0,0,0,.8)}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .55s ease,transform .55s ease;transform:scale(1.02);overflow:hidden}
.slide.active{opacity:1;visibility:visible;transform:scale(1)}
.pad{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column}
.bg-light{background:radial-gradient(1200px 500px at 88% -10%,rgba(0,144,192,.10),transparent 60%),linear-gradient(180deg,#fff,#f3f8fc)}
.bg-tint{background:radial-gradient(900px 500px at 90% 110%,rgba(0,144,192,.10),transparent 60%),linear-gradient(180deg,#f6fafd,#eef5fb)}
.bg-dark{background:radial-gradient(900px 600px at 82% 8%,rgba(87,182,221,.30),transparent 55%),radial-gradient(700px 500px at 10% 100%,rgba(0,144,192,.22),transparent 60%),linear-gradient(135deg,#01244a,#003C78 58%,#0a5390)}
.bg-dark2{background:radial-gradient(800px 600px at 85% 12%,rgba(87,182,221,.22),transparent 55%),linear-gradient(150deg,#01182f,#012a52 70%)}
.kicker{font-family:var(--fb);font-weight:700;font-size:14px;letter-spacing:3px;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:10px}
.bg-dark .kicker,.bg-dark2 .kicker{color:var(--blue-l)}
.kicker .bar{width:34px;height:3px;border-radius:3px;background:currentColor}
h1.title{font-family:var(--fd);font-weight:800;color:var(--navy);font-size:42px;line-height:1.08;letter-spacing:-.5px;margin-top:14px}
.bg-dark h1.title,.bg-dark2 h1.title{color:#fff}
.lead{font-size:18px;color:var(--gray);margin-top:12px;max-width:62ch;line-height:1.5}
.bg-dark .lead,.bg-dark2 .lead{color:#bcd6ec}
.logo{height:40px}.logo.white{filter:brightness(0) invert(1)}
.brandmark{position:absolute;right:60px;bottom:34px;height:30px;opacity:.95}.brandmark.cobrand{display:flex;align-items:center;gap:14px}.brandmark.cobrand img{height:26px;width:auto}.cb-sep{width:1px;height:22px;background:rgba(255,255,255,.35)}.logo-plate{align-items:center;gap:18px;align-self:flex-start}.logo-plate .vv{filter:brightness(0)}.logo-plate .cb-sep{background:#d5dbe2;height:34px}
.footer{position:absolute;left:72px;right:72px;bottom:26px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--gray);border-top:1px solid var(--line);padding-top:10px}
.footer .sec{color:var(--blue);font-weight:700}
.bg-dark .footer,.bg-dark2 .footer{border-color:rgba(255,255,255,.14);color:#9fc0dc}.bg-dark .footer .sec,.bg-dark2 .footer .sec{color:var(--blue-l)}
.grid{display:grid;gap:18px}
.ic{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none}.ic svg{stroke-width:2.1}
.ic.navy{background:var(--navy);color:#fff}.ic.blue{background:linear-gradient(135deg,var(--blue),var(--blue-l));color:#fff}.ic.amber{background:linear-gradient(135deg,var(--amber),#f6bd78);color:#fff}.ic.soft{background:var(--tint);color:var(--navy)}
.codeblock{background:#0b1a30;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:20px 22px;font-family:var(--fc);font-size:13px;color:#e6f2fb;line-height:1.55;box-shadow:var(--shadow)}
.codeblock .k{color:var(--blue-l);font-weight:600}.codeblock .c{color:#93a7bd;font-style:italic}.codeblock .h{background:rgba(87,182,221,.14);padding:2px 6px;border-radius:5px}
.codehead{display:flex;align-items:center;gap:8px;font-size:11px;color:#7fa1c0;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;font-family:var(--fb);font-weight:700}
.codehead .dot{width:9px;height:9px;border-radius:50%}.codehead .dot.r{background:#ff5f56}.codehead .dot.y{background:#ffbd2e}.codehead .dot.g{background:#27c93f}
.step{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 16px;font-family:var(--fd);font-weight:700;font-size:13.5px;color:var(--ink);text-align:center;box-shadow:var(--shadow-sm);min-width:150px}
.step.blue{background:linear-gradient(135deg,var(--blue),var(--blue-l));color:#fff;border:transparent}
.slide .anim{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.3,1),transform .6s cubic-bezier(.2,.7,.3,1)}
.slide.active .anim{opacity:1;transform:none}
.ctl{position:fixed;z-index:50;display:flex;align-items:center;gap:14px;bottom:22px;left:50%;transform:translateX(-50%);background:rgba(6,18,34,.66);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);padding:8px 14px;border-radius:999px;color:#cfe0ee;font-size:13px;font-weight:600}
.ctl button{all:unset;cursor:pointer;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#dbe9f6}.ctl button:hover{background:rgba(255,255,255,.12)}
.progress{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--blue),var(--blue-l));z-index:60;transition:width .4s ease}
.hint{position:fixed;top:14px;right:16px;z-index:50;color:#7f9bb5;font-size:12px}
.codehead .cp{margin-left:auto;font-family:var(--fb);font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:none;color:#d6ebf8;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:4px 12px;cursor:pointer;transition:background .2s ease}.codehead .cp:hover{background:#0090C0;border-color:#0090C0;color:#fff}.codehead .cp.ok{background:#1F8A5B;border-color:#1F8A5B;color:#fff}
</style></head>
<body>
<div class="progress" id="progress"></div><div class="hint">← → · F pantalla completa</div>
<div class="viewport"><div class="deck" id="deck"><div class="stage" id="stage"></div></div></div>
<div class="ctl"><button id="prev"><i data-lucide="chevron-left"></i></button><span><span id="cur">1</span> / <span id="total">1</span></span><button id="next"><i data-lucide="chevron-right"></i></button></div>
<script>
const LOGO="logo_myworkin.png";const LOGO_VV="media/logo_vivargo.svg";const SEC="FullDay · Claude e IA para el trabajo · Grupo Vivargo";
function ic(n,c,s=22){return `<span class="ic ${c}" style="width:${s+22}px;height:${s+22}px"><i data-lucide="${n}" style="width:${s}px;height:${s}px"></i></span>`}
function footer(t){return `<div class="footer anim"><span>${SEC}</span><span class="sec">${t}</span></div>`}
function titlebar(k,t){return `<div class="titlebar anim"><div class="kicker"><span class="bar"></span>${k}</div><h1 class="title">${t}</h1></div>`}
function brand(){return `<span class="brandmark cobrand"><img src="${LOGO}" class="logo white" alt="MyWorkIn"><span class="cb-sep"></span><img src="${LOGO_VV}" class="logo vv" alt="Grupo Vivargo"></span>`}
function code(h,b){return `<div class="codeblock anim"><div class="codehead"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span>${h}</span></div>${b}</div>`}
const slides=[];

/* 1 · Cover */
slides.push(`<div class="slide bg-dark"><div class="pad">
  <div class="kicker anim"><span class="bar"></span>FullDay · Bloque 7</div>
  <h1 class="title anim" style="font-size:70px;margin-top:14px;max-width:22ch">Schedule Tasks + workflows AI-first</h1>
  <p class="lead anim" style="font-size:22px;margin-top:16px">Claude trabajando <b style="color:var(--blue-l)">de forma recurrente</b> — no solo cuando le hablas.</p>
  <div class="anim" style="margin-top:20px;color:#9fc4de;font-size:14px">15 minutos</div>
  ${brand()}
</div></div>`);

/* 2 · Schedule Tasks */
slides.push(`<div class="slide bg-light"><div class="pad" style="justify-content:center">
  <div class="kicker anim"><span class="bar"></span>Concepto</div>
  <h1 class="title anim" style="font-size:48px;margin-top:14px;max-width:26ch;line-height:1.15">Claude trabajando <span style="color:var(--blue)">de forma recurrente.</span></h1>
  <p class="lead anim" style="font-size:19px;margin-top:20px;max-width:60ch">En vez de tú abrir la conversación cada vez — le programas una tarea, y él la ejecuta en el día, la hora y con el prompt que definiste.</p>
  ${footer("Schedule")}
</div></div>`);

/* 3 · De prompt puntual a rutina */
slides.push(`<div class="slide bg-tint"><div class="pad">
  ${titlebar("De prompt puntual → a rutina","La misma tarea, pero automática cada semana")}
  <div style="display:flex;gap:24px;margin-top:24px;flex:1;align-items:center">
    <div class="anim" style="flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow-sm)">
      <div style="font-family:var(--fd);font-weight:700;font-size:11px;color:var(--gray);letter-spacing:2px;text-transform:uppercase">Prompt normal</div>
      <div style="font-family:var(--fc);font-size:16px;color:var(--ink);margin-top:12px">"Revisa los horómetros de la flota."</div>
      <div style="font-size:12.5px;color:var(--gray);margin-top:8px;font-style:italic">Lo haces cuando te acuerdas.</div>
    </div>
    <div style="align-self:center">${ic('arrow-right','navy',20)}</div>
    <div class="anim" style="flex:1.2;background:linear-gradient(160deg,var(--navy),#0a5390);border-radius:16px;padding:24px;color:#fff;box-shadow:var(--shadow-sm)">
      <div style="font-family:var(--fd);font-weight:700;font-size:11px;color:var(--blue-l);letter-spacing:2px;text-transform:uppercase">Schedule Task</div>
      <div style="font-family:var(--fc);font-size:16px;color:#fff;margin-top:12px">"Cada lunes a las 7 am revisa la carpeta de horómetros y avísame qué equipos están cerca de su preventivo."</div>
      <div style="font-size:12.5px;color:#9fc4de;margin-top:8px;font-style:italic">Pasa solo. Sin que lo pidas.</div>
    </div>
  </div>
  ${footer("Bloque 7")}
</div></div>`);

/* 4 · Fórmula */
slides.push(`<div class="slide bg-light"><div class="pad">
  ${titlebar("La fórmula","Para diseñar cualquier rutina AI-first")}
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px">
    <div class="anim" style="display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap">
    ${[["Entrada","inbox"],["Revisión","search"],["Criterios","filter"],["Salida","file-text"],["Frecuencia","calendar"],["Acción humana","user-check"]].map((s,i,arr)=>`<div class="step ${i===arr.length-1?'blue':''}" style="display:flex;align-items:center;gap:8px"><i data-lucide="${s[1]}" style="width:14px;height:14px"></i><span>${s[0]}</span></div>${i<arr.length-1?'<i data-lucide="chevron-right" style="width:16px;height:16px;color:var(--blue)"></i>':''}`).join("")}
    </div>
    <p class="lead anim" style="text-align:center;font-size:17px;max-width:60ch">Si respondes esos 6 casilleros, ya tienes una rutina bien diseñada.</p>
  </div>
  ${footer("Fórmula")}
</div></div>`);

/* 5 · Ejemplo horómetros */
slides.push(`<div class="slide bg-tint"><div class="pad">
  ${titlebar("Ejemplo · Horómetros y preventivos","Aplicando la fórmula a un caso real de la flota")}
  <div class="grid anim" style="grid-template-columns:1fr 1fr 1fr;margin-top:22px;gap:14px;flex:1;align-items:stretch">
  ${[
    ["inbox","Entrada","carpeta de horómetros de la semana, por unidad y sede"],
    ["search","Revisión","horómetro actual vs. último preventivo e intervalo"],
    ["filter","Criterios","menos de 50 horas para el preventivo · o ya vencido"],
    ["file-text","Salida","tabla por sede · Lima (Lurín), Arequipa, Trujillo"],
    ["calendar","Frecuencia","todos los lunes a las 7 am"],
    ["user-check","Acción humana","el jefe de mantenimiento programa el preventivo y avisa a Comercial"]
  ].map(c=>`<div style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;box-shadow:var(--shadow-sm)">${ic(c[0],'blue',14)}<div style="font-family:var(--fd);font-weight:700;font-size:15px;color:var(--navy);margin-top:12px">${c[1]}</div><div style="font-size:12.5px;color:var(--gray);margin-top:4px;line-height:1.5">${c[2]}</div></div>`).join("")}
  </div>
  ${footer("Ejemplo · Horómetros")}
</div></div>`);

/* 6 · Prompt horómetros */
slides.push(`<div class="slide bg-light"><div class="pad">
  ${titlebar("Prompt · Horómetros","El mismo caso — ya listo para programar")}
  <div class="anim" style="margin-top:14px;flex:1;display:flex;flex-direction:column;justify-content:center">
    ${code("Prompt programado · lunes 7 am",`<span style="white-space:pre-wrap"><span class="c">Frecuencia ·</span> Todos los <span class="k h">lunes a las 7:00 am</span>:

<span class="c">Entrada ·</span> revisa la carpeta <span class="k">Horometros_Flota</span> <span class="c">(un registro por unidad)</span>.
<span class="c">Revisión ·</span> para cada unidad, calcula
   próximo preventivo = último preventivo + intervalo
   horas restantes = próximo preventivo &minus; horómetro actual
<span class="c">Criterios ·</span> alerta si faltan <span class="k">menos de 50 horas</span> o si ya está vencido.
<span class="c">Salida ·</span> una tabla por sede <span class="c">(Lima-Lurín, Arequipa, Trujillo)</span>:
   unidad · horómetro actual · horas restantes · estado
   Primero los vencidos, luego de menor a mayor.
<span class="c">Acción humana ·</span> cierra con un mensaje corto para el jefe de
   mantenimiento: qué programar esta semana. <span class="k">No reprogrames nada.</span>

<span class="k">No inventes datos.</span> Si una unidad no tiene horómetro o
fecha de último preventivo, márcala como "sin dato".</span>`)}
  </div>
  ${footer("Demo · Horómetros")}
</div></div>`);

/* 7 · Ejemplo oportunidades */
slides.push(`<div class="slide bg-tint"><div class="pad">
  ${titlebar("Ejemplo · Radar de oportunidades cada viernes","Proyectos que van a necesitar izaje")}
  <div class="anim" style="margin-top:14px;flex:1;display:flex;flex-direction:column;justify-content:center">
    ${code("Prompt programado · viernes 8 am",`<span style="white-space:pre-wrap">Todos los <span class="k h">viernes a las 8:00 am</span>, busca en la web noticias
de los últimos 7 días sobre <span class="k">Perú y Chile</span>:

<span class="c">- Nuevos proyectos mineros o ampliaciones</span>
<span class="c">- Proyectos de energía: centrales, líneas, subestaciones</span>
<span class="c">- Paradas de planta anunciadas o programadas</span>
<span class="c">- Grandes obras de construcción industrial</span>

Arma una <span class="k">tabla de oportunidades</span>:

1. Proyecto · empresa · país y región · etapa
2. Posible necesidad de izaje <span class="c">(grúas, manlift, telehandler, cama baja)</span>
3. Cuándo podría necesitarse
4. Prioridad para el equipo comercial: alta, media, baja
5. <span class="k">Fuente</span>: medio, fecha y URL de cada noticia

Solo noticias con fuente verificable. <span class="k">Si no hay fecha o</span>
<span class="k">el dato es un rumor</span>, dilo &mdash; no lo completes tú.</span>`)}
  </div>
  ${footer("Demo · Oportunidades")}
</div></div>`);

/* 8 · Errores comunes */
slides.push(`<div class="slide bg-dark2"><div class="pad" style="justify-content:center">
  <div class="kicker anim"><span class="bar"></span>Errores comunes</div>
  <div class="anim" style="margin-top:24px;display:flex;flex-direction:column;gap:14px;max-width:820px">
  ${[
    ["alert-triangle","Programar un mal prompt","Schedule no arregla un mal prompt — lo repite todas las semanas."],
    ["clock","Frecuencia excesiva","No todo tiene que ser diario. Muchas tareas son semanales o mensuales."],
    ["user-x","Olvidar la acción humana","Si nadie revisa el output, es como no haberlo generado."],
    ["shield","Tareas críticas sin revisión","Pagos, decisiones legales, comunicación final — siempre con humano en medio."]
  ].map(c=>`<div style="display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:14px 18px">${ic(c[0],'blue',16)}<div><div style="font-family:var(--fd);font-weight:800;font-size:16px;color:#fff">${c[0]==='alert-triangle'?c[1]:c[1]}</div><div style="font-size:13px;color:#d6ebf8;margin-top:2px">${c[2]}</div></div></div>`).join("")}
  </div>
  ${brand()}
</div></div>`);

/* 9 · Frases */
slides.push(`<div class="slide bg-dark"><div class="pad" style="justify-content:center">
  ${ic('quote','blue',30)}
  <h1 class="title anim" style="font-size:36px;margin-top:22px;max-width:36ch;line-height:1.3">Schedule no arregla un mal prompt.</h1>
  <h1 class="title anim" style="font-size:36px;margin-top:6px;max-width:36ch;line-height:1.3"><span style="color:var(--blue-l)">Lo repite todas las semanas.</span></h1>
  <p class="lead anim" style="font-size:19px;margin-top:22px;max-width:60ch">Una tarea programada no es solo un recordatorio. Bien diseñada, es un <b style="color:#fff">analista recurrente.</b></p>
  ${brand()}
</div></div>`);

const stage=document.getElementById('stage');stage.innerHTML=slides.join("");
const els=[...stage.querySelectorAll('.slide')];document.getElementById('total').textContent=els.length;let idx=0;
function show(n){n=Math.max(0,Math.min(els.length-1,n));els.forEach((s,i)=>s.classList.toggle('active',i===n));idx=n;document.getElementById('cur').textContent=n+1;document.getElementById('progress').style.width=((n+1)/els.length*100)+'%';els[n].querySelectorAll('.anim').forEach((el,k)=>el.style.transitionDelay=(0.04+k*0.05)+'s');if(window.lucide)lucide.createIcons()}
document.getElementById('next').onclick=()=>show(idx+1);document.getElementById('prev').onclick=()=>show(idx-1);
document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();show(idx+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(idx-1)}else if(e.key==='Home')show(0);else if(e.key==='End')show(els.length-1);else if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()}});
stage.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.5)show(idx+1);else show(idx-1)});
function fit(){document.getElementById('deck').style.transform=`scale(${Math.min(window.innerWidth/1280,window.innerHeight/720)})`}
window.addEventListener('resize',fit);fit();if(window.lucide)lucide.createIcons();show(0);
</script><script>
/* Botón «Copiar» en cada bloque de prompt: copia el texto sin la cabecera. */
(function(){
  function copiar(txt,btn){
    var ok=function(){btn.textContent='Copiado ✓';btn.classList.add('ok');
      setTimeout(function(){btn.textContent='Copiar';btn.classList.remove('ok')},1800)};
    var legacy=function(){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';
      ta.style.opacity='0';document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');ok()}finally{ta.remove()}};
    if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(ok,legacy);else legacy();
  }
  document.querySelectorAll('.codeblock').forEach(function(cb){
    var head=cb.querySelector('.codehead');
    if(!head||head.querySelector('.cp'))return;
    var b=document.createElement('button');b.type='button';b.className='cp';b.textContent='Copiar';
    b.addEventListener('click',function(e){
      e.stopPropagation();
      head.style.display='none';var txt=cb.innerText.trim();head.style.display='';
      copiar(txt,b);
    });
    head.appendChild(b);
  });
})();
</script>
</body></html>
